contract_id: CARE_ASE_EXACT_IMPLEMENTATION_20260801
contract_version: 1
status: DESIGN_DRAFT_NOT_AUTHORIZED
repository: /users/a/e/aereinh/CARE
remote: YuukiAS/CARE_Challenge
base_branch: main
blueprint: prompts/blueprints/CARE_ASE_final_model_blueprint_20260801.md

method:
  name: CARE-ASE
  expanded_name: Asymmetric Scar Proposal and Edema Reconstruction
  task: Dataset501_CAREMyoPS
  input_order: [LGE, T2, C0]
  compact_labels:
    background: 0
    healthy_myocardium: 1
    lv_cavity: 2
    rv_cavity: 3
    pure_edema: 4
    scar: 5
  wall_union_labels: [1, 4, 5]
  injury_aux_labels: [4, 5]
  official_pathology_targets:
    scar: 5
    pure_edema: 4

forbidden_model_mechanisms:
  - second_complete_backbone
  - nnunet_or_mosaic_inference_ensemble
  - case_selector
  - bounded_anchor_residual
  - stock_class4_or_class5_logit_addition
  - stock_pathology_fallback
  - shared_private_interaction_dictionary
  - prototype_memory
  - query_decoder
  - noisy_or_composition
  - hard_roi_crop
  - local_only_refiner
  - hard_wall_coordinate_transform
  - hard_anatomy_clipping
  - learned_registration
  - clip_or_llm_prompt
  - center_id_forward_input
  - synthetic_t2
  - fixed_scar_priority

required_source_files:
  - src/care_myocardium/models/care_ase/__init__.py
  - src/care_myocardium/models/care_ase/model.py
  - src/care_myocardium/models/care_ase/stock_trunk.py
  - src/care_myocardium/models/care_ase/modality_adapters.py
  - src/care_myocardium/models/care_ase/anatomy_context.py
  - src/care_myocardium/models/care_ase/scar_branch.py
  - src/care_myocardium/models/care_ase/edema_branch.py
  - src/care_myocardium/models/care_ase/slice_extent.py
  - src/care_myocardium/training/care_ase/losses.py
  - src/care_myocardium/training/care_ase/sampler.py
  - src/care_myocardium/training/care_ase/trainer.py
  - scripts/training/care_ase/train_fold.py
  - scripts/evaluation/care_ase/evaluate_full_volume.py
  - scripts/evaluation/care_ase/build_hard_negative_manifest.py
  - scripts/validation/validate_care_ase_implementation.py
  - scripts/validation/validate_care_ase_final.py
  - tests/care_ase/test_model_contract.py
  - tests/care_ase/test_loss_and_gradient_contract.py
  - tests/care_ase/test_no_t2_safety.py
  - tests/care_ase/test_known_bad.py

required_classes:
  - CareASEModel
  - StockCompatibleTrunk
  - ModalityRoleAdapterBank
  - AnatomyContextBranch
  - SoftWallContextHead
  - ScarCoarseProposalHead
  - ScarHighResolutionDecoder
  - ScarSliceExtentHead
  - ScarContextClassifier
  - EdemaFullVolumeDecoder
  - InjuryAuxiliaryHead
  - EdemaSliceExtentHead
  - EdemaContextClassifier
  - EdemaBoundaryHead
  - CareASELoss
  - CareASESampler
  - CareASETrainer
  - CareASEFullVolumeEvaluator

stock_trunk:
  source_family: nnUNetTrainer_500epochs__nnUNetPlans__3d_fullres
  plans_source: data/nnUNet/nnUNet_preprocessed/Dataset501_CAREMyoPS/nnUNetPlans.json
  expected_patch_size: [20, 256, 256]
  parameter_byte_coverage_min: 0.99
  fp32_per_scale_max_abs_error_max: 1.0e-6
  argmax_changed_voxels_max: 0
  complete_encoder_required: true
  complete_bottleneck_required: true
  complete_decoder_required: true
  deep_supervision_heads_required: true
  dynamic_plan_introspection_required: true
  guessed_or_reduced_channels_forbidden: true
  full_trunk_trainable_after_stage_a: true
  permanent_freeze_forbidden: true

branch_point:
  shared_encoder: all_stages
  shared_decoder: low_and_middle_resolutions
  independent_pathology_decoders: highest_two_decoder_resolutions
  independent_anatomy_context_branch: true
  d0_only_shallow_head_forbidden: true

modality_role_adapters:
  scales: highest_two_decoder_resolutions
  per_adapter_layers:
    - Conv3d_1_to_16_k3_p1
    - InstanceNorm3d_16_affine
    - SiLU
    - Conv3d_16_to_Cscale_k1
  final_projection_zero_initialized: true
  scar_modalities:
    lge: mandatory_primary
    c0: auxiliary_structural
    t2: forbidden_v1
  edema_modalities:
    t2: mandatory_primary_when_available
    c0: auxiliary_structural
    lge: weak_context_scalar_initialized_zero
  scar_c0_gate_initial_logit: -1.3863
  edema_c0_gate_initial_logit: -1.3863
  edema_lge_gate_initial_value: 0.0
  free_topk_router_forbidden: true
  center_conditioning_forbidden: true

anatomy_context:
  outputs:
    - anatomy_logits_0_3
    - p_wall_union
    - p_lv
    - p_rv
    - signed_endo_distance
    - signed_epi_distance
    - wall_depth_rho
  anatomy_target_rule: remap_labels_4_and_5_to_1
  distance_clip_mm: 10.0
  distance_normalization_divisor: 10.0
  rho_formula: d_endo_div_d_endo_plus_d_epi
  invalid_slice_policy: mask_distance_and_rho_loss_only
  pathology_input_detached: true
  hard_multiply_forbidden: true
  hard_crop_forbidden: true
  geometry_fail_stop_forbidden: true

scar_branch:
  proposal_scales: [quarter_resolution, half_resolution]
  proposal_outputs:
    - occupancy_logit
    - component_center_heatmap
    - slice_presence_logit
  component_connectivity: 26
  keep_all_gt_components: true
  center_gaussian_inplane_sigma_mm: 4.0
  center_gaussian_z_sigma_slices: 1.0
  proposal_bbox_forbidden: true
  proposal_hard_crop_forbidden: true
  high_resolution_decoder:
    hidden_channels: [64, 32]
    residual_blocks_per_high_scale: 2
    final_output: z_scar
    final_classifier_initialization: copy_shape_compatible_stock_class5
  context_classes:
    - scar
    - normal_myocardium
    - blood_pool_adjacent
    - remote_background
  context_is_training_feature_not_final_replacement: true
  small_lesion_threshold_mm3: 1000.0
  sampling_percentages:
    gt_component_centered: 35
    small_component_centered: 20
    canonical_oof_fn_or_low_overlap: 20
    canonical_oof_remote_or_blood_pool_fp: 15
    random_wall_or_background: 10
  online_in_sample_hard_negative_refresh_forbidden: true

edema_branch:
  hard_proposal_or_bbox_forbidden: true
  dilation_residual_blocks: [1, 2, 4]
  hidden_channels: [64, 32]
  outputs:
    - z_pure_edema
    - z_injury_aux
    - z_edema_boundary
  pure_edema_classifier_initialization: copy_shape_compatible_stock_class4
  injury_classifier_initialization: mean_shape_compatible_stock_class4_class5
  boundary_final_layer_zero_initialized: true
  compactness_loss_forbidden: true
  largest_component_target_forbidden: true
  t2_present_only_all_edema_supervision: true
  center_balanced_complete_sampling: CenterB_CenterC_1_to_1
  sampling_percentages:
    pure_edema_positive: 35
    canonical_oof_low_volume_or_fn: 20
    edema_boundary: 20
    t2_present_safe_fp_or_blood_pool: 15
    random_wall_or_background: 10
  no_t2_edema_sampler_forbidden: true

slice_extent:
  separate_heads: [scar, edema]
  input_scale: quarter_resolution
  spatial_pooling: masked_average_plus_max_over_HW
  layers:
    - Conv1d_C_to_64_k3_p1
    - GroupNorm_8_64
    - SiLU
    - Conv1d_64_to_64_k3_p1
    - SiLU
  outputs:
    - slice_presence
    - pathology_to_wall_area_fraction
  hard_slice_zeroing_forbidden: true
  frozen_logit_bias_coefficients:
    scar_presence: 0.30
    scar_area: 0.20
    scar_wall: 0.15
    edema_presence: 0.35
    edema_area: 0.30
    edema_wall: 0.10

final_composition:
  logits:
    0: anatomy_background
    1: anatomy_healthy_myocardium
    2: anatomy_lv
    3: anatomy_rv
    4: edema_final
    5: scar_final
  operation: concatenate_then_argmax
  final_six_class_dice_ce_required: true
  posthoc_threshold_tuning_forbidden: true
  unconditional_scar_priority_forbidden: true

loss_contract:
  allowed_losses_only:
    - final6_DiceCE
    - anatomy4_DiceCE
    - wall_union_DiceBCE
    - masked_distance_SmoothL1
    - scar_binary_DiceFocal
    - scar_component_adaptive_Tversky
    - scar_center_focal_BCE
    - scar_extent_BCE_SmoothL1
    - scar_context_CE
    - edema_binary_DiceFocal
    - injury_DiceBCE
    - edema_boundary_SmoothL1
    - edema_extent_BCE_SmoothL1
    - edema_context_CE
    - soft_relation_relu
  forbidden_loss_additions:
    - compactness
    - global_hausdorff_surrogate
    - prototype_margin
    - SIP
    - distillation
  weights:
    final6: 1.00
    anatomy4: 0.50
    wall_union: 0.25
    distance: 0.10
    scar_dense: 1.00
    scar_component: 0.25
    scar_center: 0.10
    scar_extent: 0.15
    scar_context: 0.10
    edema_dense: 1.00
    injury: 0.40
    edema_boundary: 0.10
    edema_extent: 0.20
    edema_context: 0.10
    soft_relation: 0.05
  component_weight_formula: clip_sqrt_1000mm3_over_volume_1_to_4
  every_loss_requires_nonzero_denominator_receipt: true
  every_loss_requires_direct_gradient_receipt: true
  every_auxiliary_requires_on_off_intervention: true

no_t2_safety:
  pure_edema_loss: zero
  injury_loss: zero
  edema_boundary_loss: zero
  edema_extent_loss: zero
  edema_context_loss: zero
  relation_loss: zero
  edema_branch_parameter_gradient_max: 0.0
  no_t2_as_edema_negative_forbidden: true

training:
  optimizer: AdamW
  weight_decay: 1.0e-4
  physical_batch: 1
  gradient_accumulation: 4
  effective_batch: 4
  gradient_clip: 12
  precision_h100_a100: bf16
  precision_v100: fp16
  checkpoint_every_optimizer_steps: 1000
  full_volume_inner_eval_every_optimizer_steps: 2000
  total_steps_per_fold: 14000
  early_stop_forbidden: true
  stage_a:
    steps: 2000
    trainable:
      - modality_adapters
      - anatomy_context
      - scar_high_resolution_branch
      - edema_high_resolution_branch
      - extent_heads
      - context_heads
    frozen:
      - stock_encoder
      - stock_shared_decoder
    new_module_lr: 5.0e-4
    classifier_lr: 2.0e-4
    warmup_steps: 200
    minimum_lr: 5.0e-6
  stage_b:
    steps: 8000
    cumulative_end_step: 10000
    trainable:
      - all_new_modules
      - complete_shared_decoder
      - upper_two_encoder_stages
    lower_encoder_frozen: true
    new_module_lr: 3.0e-4
    shared_decoder_lr: 1.0e-4
    upper_encoder_lr: 5.0e-5
    warmup_steps: 500
    minimum_lr: 1.0e-6
    case_mixture:
      complete_tri_modal_percent: 50
      lge_only_percent: 25
      lge_c0_percent: 25
  stage_c:
    steps: 4000
    cumulative_end_step: 14000
    population: complete_tri_modal_80_only
    center_sampling: CenterB_CenterC_1_to_1
    all_layers_trainable: true
    new_module_lr: 1.0e-4
    shared_decoder_upper_encoder_lr: 5.0e-5
    lower_encoder_lr: 1.0e-5
    minimum_lr: 1.0e-6
  no_stage_may_be_skipped_for_low_intermediate_metric: true
  startup_failure_training_credit: 0
  partial_or_preempted_training_credit: 0

formal_runs:
  development_folds: [2, 3]
  train_in_parallel: true
  checkpoint_candidate_steps: [4000, 6000, 8000, 10000, 12000, 14000]
  selected_checkpoint_reload_required: true
  inner_selection_only: true
  outer_evaluation_once_after_freeze: true
  full_data_training_requires_future_user_authorization: true
  full_data_fixed_step_rule: median_selected_step_from_fold2_fold3

required_metrics:
  - Dice
  - HD95_mm
  - exact_HD_mm
  - precision
  - sensitivity
  - lesion_recall
  - small_lesion_recall_lt_1000mm3
  - component_count
  - remote_FP_count_gt_10mm
  - remote_FP_volume_mm3_gt_10mm
  - blood_pool_adjacent_FP
  - volume_ratio
  - casewise_help_harm
  - CenterB_CenterC_subgroups

sentinel_cases_required:
  - Case3008
  - Case3009
  - Case3027
  - Case3012
  - Case2034
  - Case2025
  - Case2019
  - Case2012
  - Case2009
  - Case1045
  - Case1029
  - Case8021

promotion_gates:
  scar:
    dice_delta_min: 0.015
    harm_fraction_max: 0.35
    hd95_delta_mm_max: 0.0
    remote_fp_volume_ratio_max: 1.0
    lesion_recall_delta_min_or: 0.05
    small_lesion_recall_delta_min_or: 0.10
  edema:
    dice_delta_min: 0.020
    harm_fraction_max: 0.35
    center_c_sensitivity_delta_min: 0.10
    center_b_dice_delta_min: -0.01
    hd95_delta_mm_max: 1.0
    case3008_sensitivity_delta_min: 0.15
    case3009_sensitivity_delta_min: 0.15

allowed_terminal_scientific_tokens:
  - CARE_ASE_DUAL_PATHOLOGY_READY
  - CARE_ASE_SCAR_ONLY_SIGNAL
  - CARE_ASE_EDEMA_ONLY_SIGNAL
  - CARE_ASE_NO_GO_FAITHFUL_NEGATIVE
  - OPERATIONALLY_BLOCKED_ASSET_OR_RUNTIME

no_run_prevention:
  wave_graph:
    - W0_EVIDENCE_SPLIT_ASSET_FREEZE
    - W1_FULL_IMPLEMENTATION
    - W2_MANDATORY_REPAIR_LOOP_PREFLIGHT
    - W3_FOLD2_FOLD3_FORMAL_14000_STEP_TRAINING
    - W4_RELOAD_INNER_SELECTION
    - W5_ONE_TIME_OUTER_INTERVENTION_ATLAS
    - W6_VALIDATOR_COMMIT_PUSH_NOTIFY
  W1_missing_code_is_repair_not_terminal: true
  W2_max_repair_attempts_per_failure_class: 3
  W3_depends_only_on_implementation_pass: true
  W3_cannot_depend_on_intermediate_scientific_gain: true
  no_run_terminal_token_forbidden: true
  needs_implementation_terminal_token_forbidden: true
  preflight_needs_implementation_terminal_token_forbidden: true
  formal_training_must_auto_launch_after_preflight: true

anti_downgrade_known_bad_minimum:
  - encoder_only_inheritance
  - decoder_reset
  - permanent_frozen_trunk
  - shallow_d0_only_pathology_heads
  - stock_pathology_logit_shortcut
  - missing_required_branch_or_head
  - declared_loss_not_in_total
  - declared_hard_negative_without_mask_or_gradient
  - no_t2_edema_leakage
  - query_prototype_dictionary_reintroduced
  - hard_roi_or_hard_wall_reintroduced
  - fixed_scar_priority_reintroduced
  - patch_proxy_as_full_volume
  - under_14000_steps
  - skipped_stage_b_or_c
  - checkpoint_not_reloaded
  - outer_driven_selection
  - module_presence_claimed_as_scientific_success
  - sentinel_cases_missing
  - metrics_missing_beyond_dice
  - preflight_pass_but_no_formal_run
  - pending_job_counted_as_training
  - external_model_combination_labeled_care_ase

publication_boundary:
  this_contract_authorizes_execution: false
  validation_upload_authorized: false
  docker_upload_authorized: false
  hosted_metric_claim_authorized: false
  push_task_branch_authorized: false
  main_push_after_future_authorized_controller: true
  notifier_after_future_terminal_main_push: true
