contract_id: CARE_ASE_EXACT_IMPLEMENTATION_V2_20260801
contract_version: 2
status: DESIGN_REVISED_NOT_AUTHORIZED
repository: /users/a/e/aereinh/CARE
remote: YuukiAS/CARE_Challenge
base_branch: main
blueprint: prompts/blueprints/CARE_ASE_final_model_blueprint_v2_20260801.md
supersedes:
  - prompts/blueprints/CARE_ASE_exact_implementation_contract_20260801.yaml
  - prompts/blueprints/CARE_ASE_final_model_blueprint_20260801.md

method:
  name: CARE-ASE
  expanded_name: Asymmetric Scar Proposal and Edema Reconstruction
  dataset: Dataset501_CAREMyoPS
  input_order: [LGE, T2, C0]
  compact_labels: {background: 0, healthy_myocardium: 1, lv_cavity: 2, rv_cavity: 3, pure_edema: 4, scar: 5}
  wall_union_labels: [1, 4, 5]
  injury_aux_labels: [4, 5]
  final_model_type: single_end_to_end_checkpoint

forbidden_model_mechanisms:
  - second_complete_backbone
  - inference_ensemble_or_case_selector
  - bounded_anchor_residual
  - stock_class4_or_class5_logit_input_addition_or_fallback
  - encoder_only_inheritance
  - decoder_reset
  - random_or_shallow_d0_only_pathology_head
  - shared_private_interaction_dictionary
  - prototype_memory_or_query_decoder
  - noisy_or_composition
  - hard_roi_crop_or_local_only_refiner
  - hard_wall_transform_or_hard_anatomy_clipping
  - learned_registration
  - clip_llm_prompt_or_synthetic_t2
  - center_id_forward_input
  - fixed_scar_priority
  - per_pathology_checkpoint_parameter_splicing

split_contract:
  source: data/nnUNet/nnUNet_preprocessed/Dataset501_CAREMyoPS/splits_final.json
  development_folds: [2, 3]
  outer_rule: original_validation_cases_for_development_fold
  development_pool_rule: all_other_original_folds
  inner_fraction: 0.20
  inner_seed_formula: 20260801_plus_fold
  inner_strata: [center, availability_pattern, t2_present, scar_volume_bin]
  scar_volume_bins_mm3: [0, 1000, 5000, inf]
  actual_train_rule: development_pool_minus_inner
  inner_must_not_enter_training: true
  outer_must_not_enter_training_or_selection: true
  stage_c_population: actual_train_complete_tri_modal_only
  all_set_intersections_must_be_empty: true
  required_receipts: [split_receipt.json, split_case_lists.json, split_hash_manifest.json]

required_source_files:
  - src/care_myocardium/models/care_ase/__init__.py
  - src/care_myocardium/models/care_ase/model.py
  - src/care_myocardium/models/care_ase/stock_trunk.py
  - src/care_myocardium/models/care_ase/modality_adapters.py
  - src/care_myocardium/models/care_ase/anatomy_context.py
  - src/care_myocardium/models/care_ase/scar_branch.py
  - src/care_myocardium/models/care_ase/edema_branch.py
  - src/care_myocardium/models/care_ase/slice_extent.py
  - src/care_myocardium/training/care_ase/losses.py
  - src/care_myocardium/training/care_ase/sampler.py
  - src/care_myocardium/training/care_ase/trainer.py
  - scripts/training/care_ase/train_fold.py
  - scripts/evaluation/care_ase/evaluate_full_volume.py
  - scripts/evaluation/care_ase/build_hard_negative_manifest.py
  - scripts/validation/validate_care_ase_implementation.py
  - scripts/validation/validate_care_ase_final.py
  - tests/care_ase/test_model_contract.py
  - tests/care_ase/test_loss_and_gradient_contract.py
  - tests/care_ase/test_no_t2_safety.py
  - tests/care_ase/test_known_bad.py

stock_initialization:
  source_family: nnUNetTrainer_500epochs__nnUNetPlans__3d_fullres
  plans_source: data/nnUNet/nnUNet_preprocessed/Dataset501_CAREMyoPS/nnUNetPlans.json
  expected_patch_size: [20, 256, 256]
  parameter_byte_coverage_min: 0.99
  complete_encoder_bottleneck_decoder_and_deep_supervision_required: true
  dynamic_plan_and_module_introspection_required: true
  guessed_or_reduced_channels_forbidden: true
  compatibility_fp32_per_scale_max_abs_error: 1.0e-6
  compatibility_argmax_changed_voxels: 0

branch_topology:
  split_before_highest_decoder_resolutions: 2
  shared_encoder: all_stages
  shared_decoder: all_stages_below_split
  scar_top_stages: exact_clone_of_stock_highest_two_decoder_stages
  edema_top_stages: exact_clone_of_stock_highest_two_decoder_stages
  clone_includes: [transition, skip_fusion, convolution_blocks, deep_supervision_classifier]
  clone_shape_compatible_weight_coverage_min: 0.99
  extra_feature_injection: zero_initialized_residual_projection_only
  step0_scar_logit_parity_vs_stock_class5_max_abs_error: 1.0e-6
  step0_edema_logit_parity_vs_stock_class4_max_abs_error: 1.0e-6
  normal_forward_must_not_read_stock_pathology_logits: true
  full_trunk_trainable_after_stage_a: true

modality_adapters:
  scales: highest_two_decoder_resolutions
  architecture: [Conv3d_1_16_k3_p1, InstanceNorm3d_16_affine, SiLU, Conv3d_16_Cscale_k1]
  final_projection_zero_initialized: true
  missing_input_and_output_hard_zero: true
  availability_source: manifest
  scar_roles: {LGE: mandatory, C0: auxiliary_gate_0_2, T2: forbidden}
  edema_roles: {T2: mandatory_when_present, C0: auxiliary_gate_0_2, LGE: weak_tanh_gate_0}
  free_router_or_center_conditioning_forbidden: true

anatomy_context:
  outputs: [anatomy_logits_0_3, p_wall_union, p_lv, p_rv, signed_endo_distance, signed_epi_distance, wall_depth_rho]
  anatomy_target: remap_labels_4_and_5_to_1
  distance_target: physical_signed_edt
  distance_clip_mm: 10.0
  distance_divisor: 10.0
  rho_formula: d_endo_div_d_endo_plus_d_epi_plus_1e_6
  invalid_topology_slice_policy: mask_distance_and_rho_only
  detached_before_pathology: true
  hard_multiply_crop_or_fail_stop_forbidden: true

scar_branch:
  proposal_scales: [quarter_resolution, half_resolution]
  proposal_outputs: [occupancy_logit, component_center_heatmap, slice_presence_logit]
  component_connectivity: 26
  center_gaussian_inplane_sigma_mm: 4.0
  center_gaussian_z_sigma_slices: 1.0
  keep_all_gt_components: true
  bbox_or_hard_crop_forbidden: true
  final_output: z_scar
  context_classes: [scar, normal_myocardium, blood_pool_adjacent, remote_background]
  context_priority: [scar, blood_pool_adjacent, normal_myocardium, remote_background]
  blood_pool_adjacent_distance_mm_max: 3.0
  normal_myocardium_min_distance_from_blood_and_pathology_mm: 3.0
  remote_background_distance_from_wall_mm_min: 10.0
  small_lesion_threshold_mm3: 1000.0
  oof_fn_component_recall_max: 0.50
  oof_fp_component_precision_max: 0.10
  blood_pool_fp_fraction_within_3mm_min: 0.50
  sampling_percentages: {gt_component: 35, small_component: 20, oof_fn: 20, oof_fp: 15, random: 10}
  oof_source_must_be_patient_held_out_stock_prediction: true
  online_in_sample_refresh_forbidden: true

edema_branch:
  final_outputs: [z_pure_edema, z_injury_aux, z_edema_boundary]
  extra_context_dilations: [1, 2, 4]
  extra_context_must_enter_through_zero_init_projection: true
  hard_proposal_bbox_compactness_or_largest_component_forbidden: true
  boundary_target_sign: positive_inside_negative_outside
  boundary_clip_mm: 10.0
  boundary_divisor: 10.0
  boundary_valid_region: within_10mm_or_gt_positive
  context_classes: [pure_edema, normal_myocardium, blood_pool_adjacent, remote_background]
  t2_present_only: true
  center_balance: CenterB_CenterC_1_to_1_with_replacement_within_actual_train
  sampling_percentages: {positive: 35, oof_fn_or_low_volume: 20, boundary: 20, safe_fp: 15, random: 10}
  no_t2_sampler_forbidden: true

slice_extent:
  heads: [scar, edema]
  input_scale: quarter_resolution
  pooling: detached_wall_weighted_average_plus_masked_max_over_HW
  empty_predicted_wall_fallback_threshold_sum: 1.0
  empty_predicted_wall_fallback: full_slice_average_plus_max
  target_presence: pathology_slice_nonempty
  target_area: pathology_voxels_div_gt_wall_voxels
  zero_gt_wall_area_loss_policy: ignore_area_keep_presence
  inference_probability_clamp: [0.01, 0.99]
  hard_slice_zeroing_forbidden: true
  fixed_bias: {scar_presence: 0.30, scar_area: 0.20, scar_wall: 0.15, edema_presence: 0.35, edema_area: 0.30, edema_wall: 0.10}

conditional_final_competition:
  t2_present_logits: [z0, z1, z2, z3, z4, z5]
  t2_present_loss: six_class_DiceCE
  no_t2_logits: [z0, z1, z2, z3, z5]
  no_t2_loss: five_class_DiceCE_without_class4
  no_t2_z4_excluded_from_loss_graph: true
  no_t2_inference_class4_excluded: true
  posthoc_threshold_or_scar_priority_forbidden: true

loss_semantics:
  multiclass_dicece:
    activation: softmax
    dice_classes: foreground_only
    smooth: 1.0e-5
    reduction: per_case_then_valid_case_mean
  binary_dice:
    activation: sigmoid
    smooth: 1.0e-5
    reduction: per_case
    empty_gt_dice_term: zero_denominator_receipt_and_bce_or_focal_controls_fp
  scar_focal: {alpha: 0.25, gamma: 2.0}
  edema_focal: {alpha: 0.35, gamma: 2.0}
  component_tversky: {alpha: 0.3, beta: 0.7, reduction: per_gt_component_weighted_mean, no_component_value: 0.0}
  component_weight: clip_sqrt_1000mm3_over_volume_1_to_4
  context_ce: non_ignore_voxels_only
  relation: relu_max_stopgrad_scar_edema_minus_injury
  weights: {final_competition: 1.00, anatomy4: 0.50, wall: 0.25, distance: 0.10, scar_dense: 1.00, scar_component: 0.25, scar_center: 0.10, scar_extent: 0.15, scar_context: 0.10, edema_dense: 1.00, injury: 0.40, edema_boundary: 0.10, edema_extent: 0.20, edema_context: 0.10, relation: 0.05}
  forbidden_additions: [compactness, global_hd_surrogate, prototype_margin, SIP, distillation]
  every_term_requires_denominator_gradient_and_on_off_receipts: true

no_t2_safety:
  edema_exclusive_losses: exact_zero
  edema_exclusive_parameter_gradient_max_abs: 0.0
  class4_excluded_from_final_competition: true
  no_t2_as_edema_negative_forbidden: true

training:
  optimizer: AdamW
  weight_decay: 1.0e-4
  physical_batch: 1
  gradient_accumulation: 4
  effective_batch: 4
  gradient_clip: 12
  h100_a100_precision: bf16
  v100_authorized: false
  checkpoint_every_steps: 1000
  inner_full_volume_eval_every_steps: 2000
  total_steps_per_fold: 14000
  early_stop_or_stage_skip_forbidden: true
  stage_a: {start: 0, end: 2000, frozen: [encoder, shared_decoder_below_split], trainable: [cloned_top_stages, zero_init_injections, anatomy_aux, scar_aux, edema_aux, extent, context], new_lr: 5.0e-4, cloned_classifier_lr: 2.0e-4, warmup: 200, min_lr: 5.0e-6}
  stage_b: {start: 2000, end: 10000, trainable: [all_new, shared_decoder_all, upper_two_encoder_stages], lower_encoder_frozen: true, new_lr: 3.0e-4, shared_decoder_lr: 1.0e-4, upper_encoder_lr: 5.0e-5, warmup: 500, min_lr: 1.0e-6, case_mix: {complete: 50, LGE_only: 25, LGE_C0: 25}}
  stage_c: {start: 10000, end: 14000, population: actual_train_complete_only, all_layers_trainable: true, new_lr: 1.0e-4, shared_decoder_upper_encoder_lr: 5.0e-5, lower_encoder_lr: 1.0e-5, min_lr: 1.0e-6}

checkpoint_selection:
  candidate_steps: [4000, 6000, 8000, 10000, 12000, 14000]
  complete_checkpoint_only: true
  single_checkpoint_per_fold_required: true
  joint_score: 0.5_times_scar_score_plus_0.5_times_edema_score
  tie_break: later_step
  scar_score: scar_Dice_minus_0_002_excess_HD95_minus_0_00002_remote_FP_volume_minus_0_05_excess_harm_over_0_35
  edema_score: edema_Dice_plus_0_20_sensitivity_minus_0_05_abs_volume_ratio_minus_1_minus_0_002_excess_HD95
  selected_checkpoint_full_reload_required: true
  parameter_splicing_across_steps_forbidden: true
  outer_access_before_freeze_forbidden: true

slurm_and_resume:
  chunks_per_fold: 7
  optimizer_steps_per_chunk: 2000
  max_walltime_per_job_hours: 8
  training_dependency: afterok
  finalizer_dependency: afterany
  exact_python: /users/a/e/aereinh/CARE/envs/env_CARE/bin/python
  primary_partition: htzhulab
  first_pending_check_hours: 2
  mirror_partition_after_first_pending_check: a100-gpu
  winner_selection: atomic_per_fold_per_chunk_lock
  cancel_pending_mirror_after_winner_starts: true
  v100_forbidden: true
  scheduler_block_checks: 12
  scheduler_block_interval_hours: 2
  max_startup_retries: 2
  max_preemption_retries: 2
  max_unknown_retries: 0
  failed_attempt_training_credit: zero
  checkpoint_state_required: [model, optimizer, scheduler, precision_scaler_if_used, global_step, stage_step, python_rng, numpy_rng, torch_rng, cuda_rng, sampler_cursor, batch_descriptor_cursor, code_hash, config_hash, split_hash]
  resume_must_validate_hashes_and_next_batch: true
  step_reset_overlap_gap_or_duplicate_forbidden: true

wave_graph:
  - W0_EVIDENCE_SPLIT_ASSET_FREEZE
  - W1_FULL_IMPLEMENTATION
  - W2_MANDATORY_REPAIR_LOOP_PREFLIGHT
  - W3_FOLD2_FOLD3_14000_STEP_TRAINING
  - W4_SINGLE_CHECKPOINT_RELOAD_AND_INNER_FREEZE
  - W5_ONE_TIME_OUTER_INTERVENTION_ATLAS
  - W6_MAPPER_VALIDATOR_REVIEW_COMMIT_PUSH_NOTIFY
no_run_prevention:
  W1_missing_implementation_is_same_goal_repair: true
  W2_max_repair_attempts_per_failure_class: 3
  W3_depends_only_on_implementation_pass: true
  formal_training_auto_launch_after_W2: true
  early_scientific_metric_cannot_block_W3_or_stage_transition: true
  submitted_pending_running_preempted_awaiting_sacct_not_terminal: true
  no_run_or_needs_implementation_terminal_tokens_forbidden: true

required_metrics:
  - Dice
  - HD95_mm
  - exact_HD_mm
  - precision
  - sensitivity
  - lesion_recall
  - small_lesion_recall_lt_1000mm3
  - component_count
  - remote_FP_count_and_volume_gt_10mm
  - blood_pool_adjacent_FP
  - volume_ratio
  - casewise_help_harm
  - CenterB_CenterC
sentinel_cases: [Case3008, Case3009, Case3027, Case3012, Case2034, Case2025, Case2019, Case2012, Case2009, Case1045, Case1029, Case8021]

promotion_gates:
  scar: {dice_delta_min: 0.015, harm_fraction_max: 0.35, hd95_delta_mm_max: 0.0, remote_fp_volume_ratio_max: 1.0, lesion_recall_delta_min_or: 0.05, small_lesion_recall_delta_min_or: 0.10}
  edema: {dice_delta_min: 0.020, harm_fraction_max: 0.35, center_c_sensitivity_delta_min: 0.10, center_b_dice_delta_min: -0.01, hd95_delta_mm_max: 1.0, case3008_sensitivity_delta_min: 0.15, case3009_sensitivity_delta_min: 0.15}
allowed_scientific_tokens: [CARE_ASE_DUAL_PATHOLOGY_READY, CARE_ASE_SCAR_ONLY_SIGNAL, CARE_ASE_EDEMA_ONLY_SIGNAL, CARE_ASE_NO_GO_FAITHFUL_NEGATIVE, OPERATIONALLY_BLOCKED_ASSET_OR_RUNTIME]

anti_downgrade_known_bad:
  - encoder_only_or_decoder_reset
  - random_shallow_pathology_decoder
  - stock_pathology_logit_shortcut_or_fallback
  - no_t2_class4_gradient_through_final_loss
  - stage_c_uses_inner_outer_or_all_80
  - per_pathology_checkpoint_splicing
  - missing_branch_loss_sampler_or_evaluator
  - declared_loss_not_in_total
  - declared_hard_negative_not_read_by_sampler
  - module_present_without_final_output_effect
  - patch_proxy_as_full_volume
  - under_14000_steps_or_skipped_stage
  - checkpoint_not_reloaded
  - outer_driven_selection
  - sentinel_or_non_dice_metrics_missing
  - preflight_pass_without_auto_training_launch
  - controller_exits_pending_or_monitor_state
  - custom_smtp_or_notify_before_terminal_push

publication_boundary:
  execution_authorized: false
  training_authorized: false
  validation_upload_authorized: false
  docker_upload_authorized: false
  hosted_metric_claim_authorized: false
  future_formal_controller_must_freeze_commit_push_permissions_at_start: true
  no_second_manual_pause_after_formal_authorization: true
  notifier: existing_controller_notifications_only_after_terminal_push_accounting
