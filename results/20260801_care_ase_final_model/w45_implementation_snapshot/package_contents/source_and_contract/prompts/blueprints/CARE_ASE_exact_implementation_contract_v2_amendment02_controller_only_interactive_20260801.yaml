contract_id: CARE_ASE_EXACT_IMPLEMENTATION_V2_AMENDMENT02_CONTROLLER_ONLY_INTERACTIVE_20260801
status: DESIGN_REVISED_NOT_AUTHORIZED
base_contract: prompts/blueprints/CARE_ASE_exact_implementation_contract_v2_20260801.yaml
prior_amendment: prompts/blueprints/CARE_ASE_exact_implementation_contract_v2_amendment01_20260801.yaml
precedence: this_amendment_overrides_conflicting_prior_fields

role_model_override:
  planner_runtime_critic_required: false
  independent_runtime_reviewer_required: false
  controller_is_coordinator_and_acceptance_owner: true
  executor_count: 1
  executor_declares_goal_complete: false
  controller_must_inspect_real_diff_runtime_and_evidence: true
  controller_same_goal_repair_required: true
  mapper_required_for_architecture_wiki_and_fingerprint: true
  validator_required: true
  controller_terminal_decision_values:
    - VERIFIED_COMPLETE
    - OPERATIONALLY_BLOCKED
  needs_repair_is_internal_nonterminal_while_authorized_repair_exists: true

extent_and_wall_bias_parity_override:
  issue_closed: direct_fixed_extent_and_wall_bias_would_break_step0_pathology_logit_parity_and_can_suppress_early_small_or_diffuse_lesions
  fixed_weighted_scar_bias_terms: {presence: 0.30, area: 0.20, wall: 0.15}
  fixed_weighted_edema_bias_terms: {presence: 0.35, area: 0.30, wall: 0.10}
  bias_activation_schedule:
    compatibility_and_step0_parity: 0.0
    stage_a_steps_0_to_500: 0.0
    stage_a_steps_500_to_2000: deterministic_linear_ramp_0_to_1
    stage_b_and_stage_c: 1.0
    inference: 1.0
  ramp_uses_global_optimizer_step: true
  ramp_state_saved_and_reloaded: true
  learned_or_case_specific_ramp_forbidden: true
  hard_slice_zeroing_forbidden: true
  final_step0_scar_and_edema_logit_parity_max_abs_error: 1.0e-6

sentinel_case_authority_override:
  every_sentinel_case_must_be_tagged: [actual_train, inner, outer]
  outer_sentinel_may_enter_promotion_gate: true
  actual_train_or_inner_sentinel_is_descriptive_only: true
  actual_train_or_inner_sentinel_must_not_change_checkpoint_threshold_coefficients_decode_or_promotion: true
  case_specific_gate_requires_patient_held_out_outer_status: true
  if_case3008_or_case3009_is_not_outer:
    replacement_gate: frozen_outer_CenterC_underactivation_subgroup
    subgroup_definition: T2_present_CenterC_outer_cases_with_stock_pure_edema_sensitivity_le_0_20
    minimum_case_count: 2
    metric: mean_pure_edema_sensitivity_delta
    required_delta_min: 0.10
    named_case_is_still_reported_descriptively: true
  case2009_mosaic_reference_gate_requires_outer_status: true
  nonouter_case2009_is_visual_diagnostic_only: true
  sentinel_split_authority_receipt: results/20260801_care_ase_final_model/sentinel_split_authority.csv

interactive_runtime_override:
  all_primary_model_work_uses_interactive_allocation: true
  preferred_existing_allocation:
    job_id: 61220581
    expected_partition: htzhulab
    expected_job_name: CareDPR5d
    expected_user: aereinh
    expected_node: g1807htzh01
  existing_allocation_must_be_live_verified_with:
    - squeue_user_htzhulab
    - squeue_specific_job
    - scontrol_show_job
    - srun_cuda_python_preflight
  command_launch_prefix: srun_--jobid_61220581_--overlap
  existing_allocation_identity_mismatch_is_repair_or_resource_reroute_not_silent_use: true
  primary_fold_on_interactive: fold2
  optional_parallel_fold:
    fold: fold3
    partition: htzhulab
    submission_allowed_only_for_parallelism: true
    same_code_config_split_and_budget_required: true
    isolated_runtime_log_lock_required: true
    if_pending_when_interactive_fold_finishes: cancel_pending_job_then_run_fold3_serially_on_interactive
    if_job_has_started: allow_it_to_finish_and_do_not_duplicate_on_interactive
  a100_volta_or_other_partition_mirror_forbidden: true
  current_allocation_remaining_time_check_required_before_W3: true
  runtime_estimate_from_real_preflight_required: true
  minimum_remaining_time_buffer_hours: 2
  if_existing_allocation_cannot_finish_remaining_authorized_work:
    action: request_or_submit_replacement_htzhulab_interactive_allocation_before_current_allocation_expires
    keep_exact_resume_state: true
    continue_goal_without_returning_to_planner: true
  exact_resume_chunks_per_fold: 7
  optimizer_steps_per_chunk: 2000
  checkpoint_every_steps: 1000
  chunk_boundaries_must_not_reset_stage_or_sampler: true
  submitted_pending_running_preempted_startup_failed_awaiting_sacct_not_terminal: true
  failed_attempt_training_credit: zero
  pending_parallel_job_is_not_a_reason_to_stop_interactive_serial_progress: true

block_policy_override:
  controller_must_exhaust_same_scope_repair_and_resource_fallback_before_block: true
  implementation_failure_repair_attempts_per_failure_class: 3
  startup_retries: 2
  preemption_retries: 2
  block_allowed_only_for:
    - frozen_data_split_or_checkpoint_unreadable_after_verified_path_and_permission_repair
    - irrecoverable_repository_or_storage_corruption_with_reproducer
    - no_usable_existing_or_replacement_htzhulab_interactive_allocation_and_no_parallel_htzhulab_job_started_after_24_hour_evidence_threshold
    - three_same_contract_implementation_repairs_failed_with_attempt_diffs_and_minimal_reproducer
    - unrecoverable_quota_or_filesystem_failure_after_safe_cleanup_and_alternate_users_local_runtime_path
  low_metric_visual_quality_or_scientific_disappointment_never_blocks_W3_or_stage_transition: true
  missing_module_head_loss_sampler_or_evaluator_is_W1_repair_not_block: true
  preflight_failure_is_W2_repair_not_block_until_attempt_budget_exhausted: true
  scheduler_pending_below_24_hours_is_monitor_not_block: true
  controller_goal_must_remain_responsible_until_achieved_or_blocked_packet_is_pushed_and_notified: true

terminal_commit_push_notify_override:
  independent_reviewer_step_removed: true
  terminal_order:
    - terminal_runtime_or_blocked_evidence_aggregation
    - mapper_final_when_architecture_or_wiki_changed
    - strict_validator_pass_for_achieved_or_blocked_packet
    - controller_diff_contract_and_evidence_verification
    - create_main_lightweight_commit
    - push_origin_main
    - verify_local_remote_main_sha_equality
    - write_notification_brief_json
    - invoke_existing_notify_goal_watcher_once
  both_achieved_and_blocked_goals_require_push_and_email: true
  blocked_packet_must_include_attempt_lineage_reproducer_and_next_action: true
  push_failure_is_same_goal_operational_retry_not_immediate_terminal_block: true
  custom_smtp_forbidden: true
  notification_command: ./envs/env_CARE/bin/python controller_notifications/notify_goal_watcher.py --once
  notify_before_push_and_remote_sha_equality_forbidden: true
  validation_docker_upload_and_hosted_metric_claim_remain_forbidden: true

publication_boundary:
  current_design_audit_execution_authorized: false
  current_design_audit_training_authorized: false
  future_formal_controller_must_set_allow_git_commit_true: true
  future_formal_controller_must_set_auto_git_commit_true: true
  future_formal_controller_must_set_allow_git_push_true: true
  future_formal_controller_must_set_auto_git_push_true: true
  future_formal_controller_requires_no_second_human_pause: true
