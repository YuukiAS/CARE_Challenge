ute_B_round04_coordinator_receipt_20260719.md\",\n    \"prompts/routes/route_B_round04_critic_rereview.md\",\n    \"prompts/routes/portfolio_round04_route_C_followup_decision_20260719.md\",\n    \"scripts/ops/build_route_watchboard.py\",\n    \"tests/ops/test_build_route_watchboard.py\",\n    \"tests/ops/test_controller_notifications.py\",\n}\nPREFIX_ALLOWED = (\n    \"docs/figures/round03_route_architecture/\",\n    \"controller_notifications/\",\n)\n\ndef run(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:\n    return subprocess.run(args, cwd=MAIN, check=check, text=True,\n                          stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n\ndef git(*args: str) -> str:\n    return run(\"git\", \"-C\", str(MAIN), *args).stdout.strip()\n\ndef frontmatter(text: str) -> dict:\n    if not text.startswith(\"---\\n\"):\n        raise ValueError(\"missing YAML frontmatter\")\n    parts = text.split(\"---\", 2)\n    data = yaml.safe_load(parts[1])\n    if not isinstance(data, dict):\n        raise ValueError(\"frontmatter is not a mapping\")\n    return data\n\ndef show(commit: str, path: str) -> str:\n    proc = run(\"git\", \"-C\", str(MAIN), \"show\", f\"{commit}:{path}\", check=False)\n    if proc.returncode != 0:\n        raise FileNotFoundError(f\"{path}: {proc.stderr.strip()}\")\n    return proc.stdout\n\ndef blob_at(commit: str, path: str) -> str:\n    return git(\"rev-parse\", f\"{commit}:{path}\")\n\ndef allowed_path(path: str) -> bool:\n    return path in EXACT_ALLOWED or any(path.startswith(prefix) for prefix in PREFIX_ALLOWED)\n\ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\ndef write_json(path: Path, payload: dict) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(json.dumps(payload, indent=2, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n\ndef fail(reason: str, detail: str = \"\") -> None:\n    FAIL_DIR.mkdir(parents=True, exist_ok=True)\n    payload = {\"status\": FAIL_TOKEN, \"reason\": reason, \"detail\": detail}\n    write_json(FAIL_DIR / \"materialization_failure.json\", payload)\n    write_json(FAIL_DIR / \"completion.json\", payload)\n    print(FAIL_TOKEN, file=sys.stderr)\n    print(f\"{reason}: {detail}\", file=sys.stderr)\n    raise SystemExit(1)\n\ntry:\n    if not (MAIN / \".git\").exists():\n        fail(\"PLANNING_SOURCE_UNREADABLE\", str(MAIN))\n    if git(\"rev-parse\", \"origin/route_B\") != EXPECTED_ROUTE_B:\n        fail(\"ROUTE_EVIDENCE_REF_MISMATCH\", \"origin/route_B\")\n    if git(\"rev-parse\", \"origin/route_C\") != EXPECTED_ROUTE_C:\n        fail(\"ROUTE_EVIDENCE_REF_MISMATCH\", \"origin/route_C\")\n    route_branch = subprocess.check_output(\n        [\"git\", \"-C\", str(ROUTE), \"branch\", \"--show-current\"], text=True\n    ).strip()\n    if route_branch != \"route_B\":\n        fail(\"STALE_PLANNING_BINDING\", f\"route branch={route_branch}\")\n    route_dirty = subprocess.check_output(\n        [\"git\", \"-C\", str(ROUTE), \"status\", \"--porcelain\"], text=True\n    ).strip()\n    if route_dirty:\n        fail(\"STALE_PLANNING_BINDING\", \"route_B worktree not clean before materialization\")\n\n    current_main = git(\"rev-parse\", \"origin/main\")\n    texts = {path: show(current_main, path) for path in SNAPSHOT_PATHS}\n    handoff = frontmatter(texts[HANDOFF_PATH])\n    receipt = frontmatter(texts[RECEIPT_PATH])\n    expected = handoff.get(\"six_planning_blobs\")\n    if not isinstance(expected, dict) or set(expected) != set(SIX_PATHS):\n        fail(\"CURRENT_HANDOFF_MISSING\", \"six_planning_blobs mapping missing or incomplete\")\n    expected = {str(k): str(v) for k, v in expected.items()}\n    actual = {path: blob_at(current_main, path) for path in SIX_PATHS}\n    if actual != expected:\n        fail(\"PLANNING_SNAPSHOT_HASH_MISMATCH\", json.dumps({\"expected\": expected, \"actual\": actual}, sort_keys=True))\n\n    critic_text = texts[CRITIC_PATH]\n    planning_commit = str(handoff.get(\"planning_commit\", \"\"))\n    if READY_TOKEN not in critic_text or planning_commit not in critic_text:\n        fail(\"CURRENT_REREVIEW_MISSING_OR_NOT_READY\", CRITIC_PATH)\n    for value in expected.values():\n        if value not in critic_text:\n            fail(\"CURRENT_REREVIEW_MISSING_OR_NOT_READY\", f\"critic missing blob {value}\")\n\n    current_text = texts[CURRENT_PATH]\n    if HANDOFF_PATH not in current_text or \"controller_authorized_now: 0\" not in current_text:\n        fail(\"CURRENT_HANDOFF_MISSING\", CURRENT_PATH)\n\n    if receipt.get(\"status\") != \"READY_FOR_ROUTE_B_ROUND04_CRITIC_REREVIEW\":\n        fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"receipt status\")\n    if receipt.get(\"all_required_exit_codes_zero\") is not True:\n        fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"nonzero coordinator check\")\n    if receipt.get(\"working_tree_clean\") is not True:\n        fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"coordinator working tree\")\n    receipt_blobs = receipt.get(\"six_planning_blobs\")\n    if receipt_blobs != expected:\n        fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"receipt blob mapping\")\n\n    tested = str(receipt.get(\"tested_origin_main\", \"\"))\n    if not tested:\n        fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"tested_origin_main missing\")\n    descendant_paths: list[str] = []\n    relation = \"exact_current_origin_main\"\n    if tested != current_main:\n        anc = run(\"git\", \"-C\", str(MAIN), \"merge-base\", \"--is-ancestor\", tested, current_main, check=False)\n        if anc.returncode != 0:\n            fail(\"CURRENT_COORDINATOR_RECEIPT_MISSING_OR_STALE\", \"tested commit is not ancestor\")\n        descendant_paths = [p for p in git(\"diff\", \"--name-only\", tested, current_main).splitlines() if p]\n        disallowed = [p for p in descendant_paths if not allowed_path(p)]\n        if disallowed:\n            fail(\"DISALLOWED_MAIN_DESCENDANT_PATH\", \",\".join(disallowed))\n        relation = \"tested_commit_is_ancestor_with_allowlisted_descendant_diff\"\n\n    route_c_text = texts[ROUTE_C_DECISION_PATH]\n    if ROUTE_C_HOLD_TOKEN not in route_c_text or \"route_C_controller_required: false\" not in route_c_text:\n        fail(\"DISALLOWED_MAIN_DESCENDANT_PATH\", \"Route C decision semantics changed\")\n\n    if TMP.exists():\n        shutil.rmtree(TMP)\n    if SNAP.exists():\n        shutil.rmtree(SNAP)\n    TMP.mkdir(parents=True, exist_ok=False)\n\n    manifest_rows = []\n    for rel in SNAPSHOT_PATHS:\n        data = texts[rel].encode(\"utf-8\")\n        target = TMP / rel\n        target.parent.mkdir(parents=True, exist_ok=True)\n        target.write_bytes(data)\n        manifest_rows.append({\n            \"path\": rel,\n            \"git_blob_sha\": blob_at(current_main, rel),\n            \"sha256\": sha256_bytes(data),\n            \"bytes\": len(data),\n        })\n\n    manifest = {\n        \"status\": \"PASS\",\n        \"source_origin_main\": current_main,\n        \"planning_commit\": planning_commit,\n        \"snapshot_paths\": SNAPSHOT_PATHS,\n        \"files\": manifest_rows,\n    }\n    hash_audit = {\n        \"status\": \"PASS\",\n        \"six_planning_blobs_expected\": expected,\n        \"six_planning_blobs_actual\": actual,\n        \"critic_ready_token\": READY_TOKEN,\n    }\n    descendant_audit = {\n        \"status\": \"PASS\",\n        \"tested_origin_main\": tested,\n        \"current_origin_main\": current_main,\n        \"relation\": relation,\n        \"descendant_paths\": descendant_paths,\n        \"all_descendant_paths_allowlisted\": True,\n    }\n    materialization_receipt = {\n        \"status\": \"PASS\",\n        \"controller_worktree\": str(ROUTE),\n        \"source_main_worktree\": str(MAIN),\n        \"snapshot_root\": str(SNAP),\n        \"source_origin_main\": current_main,\n        \"planning_commit\": planning_commit,\n        \"six_planning_blobs\": expected,\n        \"critic_token\": READY_TOKEN,\n        \"route_C_hold_token\": ROUTE_C_HOLD_TOKEN,\n        \"entry_gate_satisfied\": True,\n        \"downstream_authorities\": {\n            \"validation_upload\": False,\n            \"route_promotion\": False,\n            \"M11\": False,\n            \"hosted_metric_claim\": False,\n            \"cross_route_merge\": False,\n            \"final_scientific_decision\": False,\n        },\n    }\n    write_json(TMP / \"MANIFEST.json\", manifest)\n    write_json(TMP / \"hash_audit.json\", hash_audit)\n    write_json(TMP / \"descendant_diff_audit.json\", descendant_audit)\n    write_json(TMP / \"materialization_receipt.json\", materialization_receipt)\n\n    for path in sorted(TMP.rglob(\"*\"), reverse=True):\n        mode = path.stat().st_mode\n        path.chmod(mode & ~stat.S_IWUSR & ~stat.S_IWGRP & ~stat.S_IWOTH)\n    TMP.chmod(TMP.stat().st_mode & ~stat.S_IWUSR & ~stat.S_IWGRP & ~stat.S_IWOTH)\n    os.replace(TMP, SNAP)\n\n    for name in (\"MANIFEST.json\", \"hash_audit.json\", \"descendant_diff_audit.json\", \"materialization_receipt.json\"):\n        payload = json.loads((SNAP / name).read_text(encoding=\"utf-8\"))\n        if payload.get(\"status\") != \"PASS\":\n            fail(\"PLANNING_SNAPSHOT_INCOMPLETE\", name)\n    print(\"ROUTE_B_ROUND04_PLANNING_SNAPSHOT_MATERIALIZED\")\nexcept SystemExit:\n    raise\nexcept Exception as exc:\n    fail(\"PLANNING_SNAPSHOT_INCOMPLETE\", f\"{type(exc).__name__}: {exc}\")\nPY\n'"
