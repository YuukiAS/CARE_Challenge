name: Assemble Route B R04 revision

on:
  pull_request:
    branches: [main]
    paths:
      - '.route_b_r04_assembly/**'
      - '.github/workflows/assemble-route-b-r04-revision.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  assemble:
    if: github.head_ref == 'agent/route-b-r04-revision-assembly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .route_b_r04_assembly/chunk*.b64 > /tmp/bundle.tgz.b64
          base64 -d /tmp/bundle.tgz.b64 > /tmp/bundle.tgz
          echo 'e6e0d5c3911a0d24afa6554307d0db4ea55cd73d9d00200b989aec446fda2207  /tmp/bundle.tgz' | sha256sum -c -
          mkdir -p /tmp/route_b_bundle
          tar -xzf /tmp/bundle.tgz -C /tmp/route_b_bundle
          python3 -m py_compile /tmp/route_b_bundle/bundle/assemble.py
      - name: Assemble clean planning candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main route_B route_C
          git reset --hard origin/main
          python3 -m pip install --quiet pyyaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 /tmp/route_b_bundle/bundle/assemble.py /tmp/route_b_bundle/bundle/payload | tee /tmp/route-b-r04-assembly-result.json
          git log --oneline -3
          git diff --check origin/main..HEAD
          git push --force origin HEAD:refs/heads/agent/route-b-r04-revision-candidate
