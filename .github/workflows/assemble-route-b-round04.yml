name: Assemble Route B Round04 final planner bundle

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Stage Route B round04 final bundle'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact six-file planner bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .planner_upload_chunks/r4bundle.part* | tr -d '\r\n' | base64 --decode > /tmp/routeB_round04_files.tar.gz
          echo 'd75e4f11f6eb23d48ced5e97dc2ebe0623adf3d6a24ba37910e3138dee5644bb  /tmp/routeB_round04_files.tar.gz' | sha256sum --check
          tar -xzf /tmp/routeB_round04_files.tar.gz
          test "$(git hash-object prompts/routes/portfolio_round04_route_B_planner_plan_20260719.md)" = '13746e0211f9d1565d84689b20a6a4ce66b1fcf3'
          test "$(git hash-object prompts/routes/route_B_round04_planner_prompt.md)" = 'e69475402659882edca04279ce47dfe8bab16493'
          test "$(git hash-object prompts/routes/route_B_round04_controller_contract.md)" = 'afa3b8cc6e2461a4ddb4332b839b0113e16e5757'
          test "$(git hash-object prompts/routes/route_B_round04_executor_plan.yaml)" = '4ea9a6632fb95020dc7e362c33e1d747bf1c6bb8'
          test "$(git hash-object prompts/routes/route_B_round04_critic_request.md)" = '265826ac9c5f5c77e6d6e1fde6a8e710e7884b0e'
          test "$(git hash-object prompts/routes/route_B_round04_planner_audit.md)" = 'c7ef75fa4536cef17ffde4d7ea5f26ef01fb6e75'

      - name: Rebind planning files to current main parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          old = '43f80f1078822c3cc17206898a244956178296e2'
          new = os.environ['BASE_SHA']
          files = [
              Path('prompts/routes/portfolio_round04_route_B_planner_plan_20260719.md'),
              Path('prompts/routes/route_B_round04_planner_prompt.md'),
              Path('prompts/routes/route_B_round04_controller_contract.md'),
              Path('prompts/routes/route_B_round04_executor_plan.yaml'),
              Path('prompts/routes/route_B_round04_critic_request.md'),
              Path('prompts/routes/route_B_round04_planner_audit.md'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(f'planner_base_main: {old}', f'planner_base_main: {new}', 1)
              if path.name == 'route_B_round04_planner_prompt.md':
                  text = text.replace(f'main base: {old}', f'main base: {new}', 1)
              if path.name == 'route_B_round04_planner_audit.md':
                  old_sentence = (
                      f'The final atomic planning commit is based on `{old}`, replaces those five paths, '
                      'and adds the portfolio plan. `origin/route_B` remained '
                      '`b9c7664da7cb1f1892fff37a4497722f31a0a96d`.'
                  )
                  new_sentence = (
                      f'Before the final detailed push, main had been rewritten by the assembly workflow to `{new}` '
                      'with a preliminary six-file candidate. The final detailed planning commit is based on that exact '
                      f'`{new}` parent and replaces all six planner paths. `origin/route_B` remained '
                      '`b9c7664da7cb1f1892fff37a4497722f31a0a96d`.'
                  )
                  if old_sentence not in text:
                      raise SystemExit('planner audit rebind sentence not found')
                  text = text.replace(old_sentence, new_sentence, 1)
              path.write_text(text, encoding='utf-8')
          print(f'planner base rebound to {new}')
          PY

      - name: Validate contracts and hardening scans
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/ops/validate_executor_plan.py prompts/routes/route_B_round04_executor_plan.yaml
          git diff --check
          FILES=(
            prompts/routes/portfolio_round04_route_B_planner_plan_20260719.md
            prompts/routes/route_B_round04_planner_prompt.md
            prompts/routes/route_B_round04_controller_contract.md
            prompts/routes/route_B_round04_executor_plan.yaml
            prompts/routes/route_B_round04_critic_request.md
            prompts/routes/route_B_round04_planner_audit.md
          )
          if grep -EIn 'TBD|optional|as appropriate|if needed|choose best|Codex decide|controller decide|按需|视情况|自行决定' "${FILES[@]}"; then
            echo 'forbidden blank authorization found' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('prompts/routes/route_B_round04_executor_plan.yaml').read_text())
          bad = []
          checked = 0
          def walk(node, path='root'):
              global checked
              if isinstance(node, dict):
                  for key, value in node.items():
                      walk(value, f'{path}.{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      walk(value, f'{path}[{index}]')
              elif isinstance(node, str) and any(tag in path.lower() for tag in ('command', 'validator')):
                  checked += 1
                  if re.search(r'(^|[;&|]\s*)python(?:3)?\s', node):
                      bad.append((path, node))
          walk(data)
          if bad:
              raise SystemExit(f'bare Python in formal command fields: {bad}')
          print(f'formal Slurm/validator command scan passed; checked={checked}')
          PY
          if grep -EIn 'future[ -]work|defer|deferred|optional|后续事项|非阻断附件|仅smoke' \
            prompts/routes/portfolio_round04_route_B_planner_plan_20260719.md \
            prompts/routes/route_B_round04_controller_contract.md \
            prompts/routes/route_B_round04_executor_plan.yaml; then
            echo 'formal CineMA/registration/temporal deferral found' >&2
            exit 1
          fi
          HITS=$(grep -EIn 'CineMA|registration|temporal|SVF|SyN' "${FILES[@]}" | wc -l)
          test "$HITS" -ge 20
          echo "CineMA/registration/temporal coverage hits: $HITS"

      - name: Commit clean final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .planner_upload_chunks
          rm -f .github/workflows/assemble-route-b-round04.yml
          git config user.name 'CARE Route B Planner'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Plan Route B round04 deep-research implementation'
          git push --force origin HEAD:refs/heads/planner-assembled-route-b-r04
