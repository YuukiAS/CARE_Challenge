name: CARE Controller Notifier CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'controller_notifications/**'
      - 'tests/ops/test_controller_notifications.py'
      - '.github/workflows/controller-notifier-ci.yml'
  pull_request:
    paths:
      - 'controller_notifications/**'
      - 'tests/ops/test_controller_notifications.py'
      - '.github/workflows/controller-notifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-controller-notifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile notifier
        run: python -m py_compile controller_notifications/notify_goal_watcher.py
      - name: Unit tests
        run: python -m pytest tests/ops/test_controller_notifications.py
