data:
  myops_target_spacing: [1.25, 1.25, 10.0]
  image_size: [192, 192]
  crop_margin: [1, 16, 16]
  channel_order: [2, 0, 1]  # T2, LGE, C0 — T2 becomes reference modality
  edema_mode: true
  registration:
    enabled: true
    mode: rigid
    reference_modality: LGE
  sampling:
    fine_class_quota:
      edema: 0.55
      scar: 0.0
      anatomy: 0.30
      background: 0.15
    seed: 3407

model:
  arch: 2d_multi
  base_channels: 24
  deep_supervision: true
  grid_size: 4
  span_range: 0.98
  use_tps: true
  use_spg: true
  use_consistency: true

training:
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.0001
  max_epochs: 300
  val_every: 5
  num_workers: 0
  weighted_sampling: true
  use_amp: false
  gradient_clip_norm: 0.1
  tps_warmup_epochs: 10
  scheduler:
    type: cosine
    min_lr: 0.000001

loss:
  class_weights: [1.0, 1.0, 0.8, 2.8, 1.0]
  deep_supervision_weights: [0.3, 0.15]
  enabled_classes: [myo, lv, rv, edema]
  pathology_tversky_weight: 0.25
  pathology_focal_weight: 0.1
  pathology_tversky_alpha: 0.7
  pathology_tversky_beta: 0.3
  pathology_focal_gamma: 2.0
  class_specific_pathology:
    edema:
      tversky_weight: 0.60
      focal_weight: 0.25
      alpha: 0.3
      beta: 0.7
      gamma: 2.0
    scar:
      tversky_weight: 0.0
      focal_weight: 0.0
  consistency_weight: 0.5
  registration_weight: 1.0

inference:
  tta:
    enabled: true
    flips: [horizontal, vertical]
  thresholds: [0.5, 0.5, 0.5, 0.3, 1.0]  # scar=1.0: disable untrained scar head

postprocess:
  min_component_sizes:
    4: 3
    5: 2
  pathology_dilation_iterations: 2

selection:
  metric: edema_dice
  metrics_to_save:
    - mean_dice
    - edema_dice
