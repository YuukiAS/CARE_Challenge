  modality_order: [LGE, T2, C0]
  labels:
    background: 0
    myocardium_wall: 1
    lv_blood: 2
    rv_blood: 3
    pure_edema: 4
    scar: 5

source_binding:
  effective_contract_fixed_path: prompts/blueprints/CARE_ASE_R2_effective_contract_v7_20260803.yaml
  critical_source_manifest_includes:
    - prompts/blueprints/CARE_ASE_R2_effective_contract_v7_20260803.yaml
    - src/care_myocardium/models/care_ase.py
    - src/care_myocardium/training/care_ase_trainer.py
    - src/care_myocardium/training/care_ase_sampler.py
