  formal_runtime_must_recompute_critical_source_manifest_sha256: true
  checkpoint_must_store_effective_contract_sha256: true
  checkpoint_must_store_critical_source_manifest_sha256: true

model_topology:
  stock_encoder_bottleneck_low_mid_decoder_runs: once
  high_resolution_paths:
    - anatomy
    - scar
    - edema
  uncontracted_auxiliary_high_resolution_decoder_allowed: false
  pathology_branches_clone_highest_two_stock_decoder_stages: true
  pathology_classifiers_are_single_row:
    scar_half: stock_stage4_row5
    scar_full: stock_stage5_row5
    edema_half: stock_stage4_row4
    edema_full: stock_stage5_row4
  stock_class4_5_normal_forward_logits_reused_for_pathology: false

modality_and_evidence:
  scar:
    mandatory_evidence: [LGE]
    forbidden_evidence: [T2]
    c0_gate_initial_output: 0.2
  edema:
    mandatory_evidence: [T2]
    c0_gate_initial_output: 0.2
    weak_lge_gate_initial_output: 0.05
    weak_lge_gate_delta_reason: break_zero_gate_plus_zero_residual_projection_dead_path
    step0_final_logit_parity_preserved_by: zero_initialized_named_residual_projection
  named_evidence_projection_required: true
  shared_multi_source_projection_allowed: false
  branch_residual_projections_zero_initialized: true
  modality_adapters_live_initialized: true

no_t2_contract:
  t2_absent_edema_module_call_count: 0
  no_t2_competition_classes: [0, 1, 2, 3, 5]
  no_t2_class4_target: ignore
  no_t2_class4_background_mapping_allowed: false
  no_t2_edema_exclusive_gradient_max_abs: 0.0
  decode_uses_fixed_argmax: true

targets_and_losses:
  segmentation_padding_value: -1
  padding_participates_in_loss_or_physical_targets: false
  edt_must_use_spacing_sampling: true
  scar_center_gaussian_sigma_mm_inplane: 4.0
  scar_center_gaussian_sigma_slices_z: 1.0
  edema_boundary_prediction_source: components.edema_boundary
  edema_boundary_empty_or_unobservable_full_edema:
    target: 0
    raw: 0
    valid: 0
  relation_loss_formula: relu(max(stopgrad(p_scar), stopgrad(p_edema)) - p_injury)
  context_ce_reduction: valid_voxel_mean
  sensitive_reductions_fp32: true
  anatomy_deep_supervision:
    full_anatomy_dice_ce: true
    half_anatomy_dice_ce: true
    total_weight: 0.50
    weights_from_stock_trainer_renormalized: true
  extent:
    source: full_case_extent_profile
    training_target_from_augmented_final_patch_segmentation_allowed: false
    statistic_function: compute_slice_extent_statistics
    statistic_formula: 0.5 * wall_weighted_mean + 0.5 * masked_max
    presence_input_is_probability: true
    presence_loss: binary_cross_entropy_on_clamped_probability
    valid_spatial_mask_excludes_padding: true
    all_invalid_slice_loss_bias_gradient: zero
    full_volume_inference_applies_global_slice_bias_after_base_logit_aggregation: true

sampler:
  stage_schedule_steps:
    A: 2000
    B: 8000
    C: 4000
  stage_a_b_cycle_per_20:
    complete: 10
    lge_only: 5
    lge_c0: 5
  stage_c_complete_only: true
  complete_center_cycle: [CenterB, CenterC]
  complete_pathology_cycle: [scar, edema]
  partial_events_pathology: scar
  partial_events_advance_complete_pathology_cursor: false
  microbatch_count_per_optimizer_step: 4
  microbatch_case_sampling: independent_with_replacement_from_eligible_pool
  micro_patch_rng_is_coordinate_authority: true
  descriptor_records_requested_and_resolved_category: true

hard_negative_oof:
  manifest_template: results/20260803_care_ase_r2_external_review_repair_v7/hard_negative_manifest_fold{fold}.json
  allowed_source: canonical_patient_held_out_stock_nnunet_oof
  allowed_binding_method: direct_stock_inference_on_preprocessed_grid
  forbidden_sources: [MoSAIC, SRR, cascade, refiner, in_sample, current_CARE_ASE]
  forbidden_binding_methods: [shape_only, transpose_only, generic_zoom, min_shape_crop, fold_level_final_or_best_guess]

augmentation:
