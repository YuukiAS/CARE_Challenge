  uses_initial_patch_semantics: true
  final_patch_size: [20, 256, 256]
  segmentation_padding_value: -1
  augmentation_rng_checkpoint_resume_required: true
  next_descriptor_hash_includes_four_augmentation_seeds: true

optimizer_scheduler:
