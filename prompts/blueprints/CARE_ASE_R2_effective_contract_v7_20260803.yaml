  optimizer_created_once_at_step0: true
  stage_transition_rebuilds_optimizer: false
  parameter_groups_by_object_id: true
  gradient_clip_error_if_nonfinite: true
  scheduler:
    type: stage_local_warmup_poly
    power: 0.9
    stage_ranges:
      A: [0, 2000]
      B: [2000, 10000]
      C: [10000, 14000]

checkpoint_resume:
  schema_version: 4
  schema_1_2_3_rejected_for_formal_resume: true
  formal_resumable_short_smoke_allowed: false
  placeholders_forbidden:
