    pass_requires: [job_terminal_success, expected_global_step, full_checkpoint_reload, source_hash_match, effective_contract_hash_match, stage_scheduler_state_match, sampler_cursor_match, next_batch_hash_match, no_step_overlap_gap_duplicate]
    next_chunk_before_pass: forbidden
  formal_training_credit:
    startup_failure_preemption_partial_checkpoint_race_loser: zero
    completed_verified_optimizer_steps_only: true
  both_fold1_and_fold4_step14000_required: true
  pending_running_awaiting_sacct: nonterminal
  scheduler_block_rule: only_after_24_hours_of_documented_htzhulab_no_start_and_no_live_61794608_or_replacement_lane
  controller_continuity: namespace_local_tmux_watcher_or_slurm_dependency_finalizer_required

