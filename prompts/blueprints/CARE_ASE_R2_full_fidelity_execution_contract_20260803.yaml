    same_case_set_and_case_id_join_required: true
    no_t2_edema_rows_excluded_from_all_edema_metrics: true
    baseline_prediction_re_evaluation_with_same_metric_implementation: required_when_prediction_sources_are_available
    unavailable_physical_metric: NOT_BOUND_DO_NOT_INFER
    predeclared_intervention_cases:
      selection_time: before_CARE_ASE_outer_predictions
      cases: all_named_sentinel_cases_that_are_outer_plus_two_lowest_nnunet_scar_Dice_and_two_lowest_nnunet_pure_edema_sensitivity_per_fold
