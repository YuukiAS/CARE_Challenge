model_contract:
  name: CARE-ASE
  input_order: [LGE, T2, C0]
  labels: {background: 0, healthy_myocardium: 1, lv_cavity: 2, rv_cavity: 3, pure_edema: 4, scar: 5}
  stock_inheritance: complete_encoder_bottleneck_low_mid_decoder_and_original_anatomy_highest_two_stages
  scar_highest_two_stages: exact_shape_compatible_clone_of_stock
  edema_highest_two_stages: exact_shape_compatible_clone_of_stock
  clone_includes: [transposed_convolution, skip_fusion, convolution_blocks, deep_supervision_classifiers]
  stock_parameter_byte_coverage_min: 0.99
  step0_anatomy_scar_edema_final_logit_max_abs_error: 1.0e-6
  step0_argmax_changed_voxels: 0
  extra_evidence_entry: separate_zero_initialized_residual_projection_per_declared_scale
  normal_forward_reads_stock_class4_or_class5_logits: false
  hard_roi_or_bbox: forbidden
  hard_wall_transform_or_hard_anatomy_clipping: forbidden
  selector_or_ensemble: forbidden
  fixed_scar_priority: forbidden
  posthoc_threshold_or_component_rule: forbidden

anatomy_contract:
  target_4class: remap_labels_4_and_5_to_1
  outputs: [anatomy_logits_0_3, p_wall_union, p_lv, p_rv, signed_endo_distance, signed_epi_distance, wall_depth_rho]
  wall_union_labels: [1, 4, 5]
  signed_distance_target: physical_EDT_clipped_to_minus10_plus10_mm_then_divided_by_10
  wall_depth_formula: d_endo_divided_by_d_endo_plus_d_epi_plus_1e_6
  invalid_topology_policy: mask_distance_and_rho_loss_only
  pathology_receives_detached_anatomy_context: true

scar_contract:
  main_modality: LGE
  auxiliary_modality: C0_gate_fixed_initial_0_2
  T2_entry: forbidden
  outputs:
    - full_resolution_z_scar
    - half_and_quarter_occupancy_logits
    - half_and_quarter_component_center_heatmaps
    - slice_presence_logits
    - slice_area_fraction
    - four_class_context_logits
  component_connectivity: 26
  center_gaussian_inplane_sigma_mm: 4.0
  center_gaussian_z_sigma_slices: 1.0
  keep_all_gt_components: true
  context_priority: [scar, blood_pool_adjacent, normal_myocardium, remote_background, ignore]
  blood_pool_adjacent: non_pathology_and_distance_to_lv_or_rv_le_3mm
  normal_myocardium: label1_and_distance_to_labels_2_3_4_5_gt_3mm
  remote_background: label0_and_distance_to_wall_union_ge_10mm
  small_lesion_threshold_mm3: 1000.0

edema_contract:
  main_modality: T2_when_present
  auxiliary_modalities: [C0_gate_initial_0_2, LGE_tanh_gate_initial_0]
  outputs:
    - full_resolution_z_pure_edema
    - injury_support_logit_labels_4_or_5
    - signed_pure_edema_boundary
    - slice_presence_logits
    - slice_area_fraction
    - four_class_context_logits
  context_dilations: [1, 2, 4]
  context_priority: [pure_edema, blood_pool_adjacent, normal_myocardium, remote_background, ignore]
  scar_label5_in_context: ignore
  T2_present_only_for_all_edema_exclusive_targets_losses_and_sampling: true
  no_t2_edema_negative_sampling: forbidden
  boundary_target: positive_inside_negative_outside_clipped_10mm_divided_10
  boundary_valid_region: abs_distance_le_10mm_or_gt_positive

loss_contract:
  total_weights:
    final_competition: 1.00
    anatomy4: 0.50
    wall: 0.25
    distance: 0.10
    scar_dense: 1.00
    scar_component: 0.25
    scar_center: 0.10
    scar_extent: 0.15
    scar_context: 0.10
    edema_dense: 1.00
    injury: 0.40
    edema_boundary: 0.10
    edema_extent: 0.20
    edema_context: 0.10
    relation: 0.05
  final_competition:
    t2_present: six_class_softmax_DiceCE
    no_t2: five_class_softmax_DiceCE_over_0_1_2_3_5_with_class4_excluded_from_graph
  anatomy4: four_class_softmax_DiceCE_on_remapped_target
  wall: binary_Dice_plus_BCE_on_labels_1_4_5
  distance: mean_SmoothL1_of_signed_endo_and_epi_on_valid_topology_voxels
  scar_dense:
    loss: binary_Dice_plus_focal_alpha_0_25_gamma_2
    scales: [full, half]
    scale_weights: exact_stock_nnunet_deep_supervision_weights_normalized_over_full_and_half
  scar_component:
    loss: per_GT_component_Tversky_alpha_0_3_beta_0_7
    component_weight: clip_sqrt_1000mm3_div_volume_mm3_1_to_4
    proposal_occupancy_scales: [quarter, half]
  scar_center: normalized_focal_BCE_on_quarter_and_half_center_heatmaps
  scar_extent:
    presence: BCEWithLogits
    area: SmoothL1_on_sigmoid_area_fraction_where_gt_wall_denominator_positive
    reduction: equal_mean_of_presence_and_valid_area_terms
  scar_context: cross_entropy_non_ignore_voxels_only
  edema_dense:
    loss: binary_Dice_plus_focal_alpha_0_35_gamma_2
    scales: [full, half]
    scale_weights: exact_stock_nnunet_deep_supervision_weights_normalized_over_full_and_half
    valid_population: t2_present_only
  injury: binary_Dice_plus_focal_alpha_0_35_gamma_2_on_labels_4_or_5_t2_present_only
  edema_boundary: SmoothL1_on_declared_valid_region_t2_present_only
  edema_extent:
    presence: BCEWithLogits_t2_present_only
    area: SmoothL1_on_sigmoid_area_fraction_where_gt_wall_denominator_positive_t2_present_only
    reduction: equal_mean_of_presence_and_valid_area_terms
  edema_context: cross_entropy_non_ignore_voxels_t2_present_only
  relation: relu_max_stopgrad_scar_edema_minus_injury_t2_present_only
  no_t2_edema_exclusive_total_loss: exact_zero
  no_t2_edema_exclusive_parameter_gradient_max_abs: 0.0
  every_loss_receipts: [denominator, finite_value, valid_fixture_nonzero_gradient, invalid_population_exact_zero, on_off_total_loss_delta]
  forbidden_losses: [compactness, HD_surrogate, prototype_margin, SIP, distillation]

area_reference_contract:
  source_population: fold_specific_actual_train_only
  scar_reference: median_scar_voxels_div_gt_wall_voxels_over_scar_positive_slices
  edema_reference: median_pure_edema_voxels_div_gt_wall_voxels_over_T2_present_pure_edema_positive_slices
  inner_or_outer_access: forbidden
  hardcoded_reference: forbidden
  probability_clamp_before_logit: [0.01, 0.99]
  presence_reference: 0.50
  wall_reference: 0.50
  bias_ramp:
    global_step_le_500: 0.0
    global_step_500_to_2000: linear_step_minus_500_div_1500
    global_step_ge_2000: 1.0
  bias_weights: {scar_presence: 0.30, scar_area: 0.20, scar_wall: 0.15, edema_presence: 0.35, edema_area: 0.30, edema_wall: 0.10}
  no_t2_edema_bias_graph_entry: forbidden

sampler_contract:
  descriptor_frozen_before_voxel_loading: true
  one_optimizer_step_microbatches: 4
  all_four_microbatches_share_case_group_and_pathology_focus: true
  microbatches_sample_independent_case_and_patch_within_frozen_stratum: true
  stage_A_B_case_group_cycle_20:
    - complete
    - lge_only
    - complete
    - lge_c0
    - complete
    - lge_only
    - complete
    - lge_c0
    - complete
    - lge_only
    - complete
    - lge_c0
    - complete
    - lge_only
    - complete
    - lge_c0
    - complete
    - lge_only
    - complete
    - lge_c0
  stage_A_B_counts_per_20: {complete: 10, lge_only: 5, lge_c0: 5}
  complete_center_cycle: alternating_CenterB_CenterC_with_replacement
  complete_pathology_focus_cycle: alternating_scar_edema
  partial_pathology_focus: scar_only
  stage_C_case_group_cycle_2: [complete_centerB, complete_centerC]
  stage_C_pathology_focus_cycle: alternating_scar_edema
  scar_within_focus_cycle_20: [gt_component, gt_component, gt_component, gt_component, gt_component, gt_component, gt_component, small_component, small_component, small_component, small_component, oof_fn, oof_fn, oof_fn, oof_fn, oof_fp, oof_fp, oof_fp, random, random]
  edema_within_focus_cycle_20: [positive, positive, positive, positive, positive, positive, positive, oof_fn_or_low_volume, oof_fn_or_low_volume, oof_fn_or_low_volume, oof_fn_or_low_volume, boundary, boundary, boundary, boundary, safe_fp, safe_fp, safe_fp, random, random]
  deterministic_fallbacks:
    scar_small_component_empty: gt_component_then_random_wall
    scar_oof_fn_empty: gt_component_then_random_wall
    scar_oof_fp_empty: remote_or_blood_pool_OOF_FP_then_random_background
    scar_gt_component_empty: random_wall_or_background
    edema_oof_fn_or_low_volume_empty: positive_then_boundary
    edema_safe_fp_empty: boundary_then_positive
    edema_positive_empty: boundary_then_random_wall
    edema_boundary_empty: positive_then_random_wall
  oof_definitions:
    scar_fn: GT_component_recall_le_0_50
    scar_fp: predicted_component_precision_le_0_10
    edema_low_volume: GT_positive_and_predicted_volume_div_gt_volume_le_0_25
    edema_fn: GT_component_recall_le_0_50
    edema_safe_fp: predicted_component_precision_le_0_10_on_T2_present_case
  oof_prediction_source: canonical_patient_held_out_stock_fold_that_did_not_train_case
  current_model_online_or_in_sample_refresh: forbidden
  deterministic_state_fields: [case_group_cursor, center_cursor, pathology_focus_cursor, scar_focus_cursor, edema_focus_cursor, sampler_rng_state, batch_descriptor_cursor, next_batch_descriptor_sha256]

optimizer_scheduler_contract:
  optimizer: AdamW_created_once_and_never_recreated_at_stage_transition
  weight_decay: 1.0e-4
  optimizer_moments_preserved_across_stage_transitions: true
  parameter_assignment: every_parameter_exactly_one_stable_named_group
  frozen_group_behavior: requires_grad_false_and_current_lr_zero
  groups:
    new_modules: modality_adapters_anatomy_aux_scar_aux_edema_aux_extent_context_and_zero_init_projections
    cloned_pathology_blocks: scar_and_edema_top_transition_skip_fusion_and_convolution_blocks_excluding_classifiers
    cloned_pathology_classifiers: scar_and_edema_deep_supervision_classifiers
    anatomy_top: original_stock_anatomy_highest_two_decoder_stages_and_rows_0_1_2_3_classifier
    shared_low_mid_decoder: stock_decoder_stages_below_split
    upper_two_encoder_stages: dynamically_resolved_highest_two_encoder_stages_closest_to_bottleneck
    lower_encoder_and_bottleneck: all_remaining_encoder_parameters
  stages:
    A:
      global_range: [0, 2000]
      trainable_groups: [new_modules, cloned_pathology_blocks, cloned_pathology_classifiers]
      base_lrs: {new_modules: 5.0e-4, cloned_pathology_blocks: 1.0e-4, cloned_pathology_classifiers: 2.0e-4}
      min_lr_each_trainable_group: 5.0e-6
      warmup_steps: 200
    B:
      global_range: [2000, 10000]
      trainable_groups: [new_modules, cloned_pathology_blocks, cloned_pathology_classifiers, anatomy_top, shared_low_mid_decoder, upper_two_encoder_stages]
      base_lrs: {new_modules: 3.0e-4, cloned_pathology_blocks: 1.0e-4, cloned_pathology_classifiers: 1.0e-4, anatomy_top: 1.0e-4, shared_low_mid_decoder: 1.0e-4, upper_two_encoder_stages: 5.0e-5}
      min_lr_each_trainable_group: 1.0e-6
      warmup_steps: 500
    C:
      global_range: [10000, 14000]
      trainable_groups: [new_modules, cloned_pathology_blocks, cloned_pathology_classifiers, anatomy_top, shared_low_mid_decoder, upper_two_encoder_stages, lower_encoder_and_bottleneck]
      base_lrs: {new_modules: 1.0e-4, cloned_pathology_blocks: 5.0e-5, cloned_pathology_classifiers: 5.0e-5, anatomy_top: 5.0e-5, shared_low_mid_decoder: 5.0e-5, upper_two_encoder_stages: 5.0e-5, lower_encoder_and_bottleneck: 1.0e-5}
      min_lr_each_trainable_group: 1.0e-6
      warmup_steps: 0
  scheduler_formula:
    stage_step_definition: zero_based_index_of_the_optimizer_step_about_to_run_within_current_stage
    stage_length: stage_end_minus_stage_start
    warmup_if_stage_step_lt_W: lr_equals_base_times_0_1_plus_0_9_times_stage_step_div_max_W_minus_1_1
    decay_otherwise: t_equals_stage_step_minus_W_div_max_stage_length_minus_W_minus_1_1_then_lr_equals_min_lr_plus_base_minus_min_lr_times_1_minus_t_power_0_9
    stage_first_step: warmup_starts_at_0_1_base_when_W_gt_0_else_base
    stage_last_step: min_lr
  precision:
    autocast: torch_cuda_bfloat16
    grad_scaler: disabled
    fp32_operations: [softmax_dice_reduction, focal_reduction, component_tversky, signed_EDT_losses, relation_loss, metric_accumulation]
  gradient_accumulation: 4
  gradient_clip_global_norm: 12.0
  total_optimizer_steps_per_fold: 14000
  fixed_checkpoint: checkpoint_step14000.pt
  inner_monitor_every_steps: 2000
  inner_monitor_role: descriptive_only
  early_stop_or_stage_skip: forbidden

checkpoint_resume_contract:
  checkpoint_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000, 14000]
  save_only_after_completed_optimizer_step_and_microbatch_cursor_zero: true
  atomic_protocol: write_tmp_fsync_file_fsync_parent_directory_atomic_rename_sha256_full_reload
  complete_fields: [model, optimizer, scheduler, precision_mode, global_optimizer_step, stage_id, stage_step, accumulation_microbatch_cursor, python_rng, numpy_rng, torch_cpu_rng, torch_cuda_rng_all_devices, dataloader_worker_seed_state, case_group_cursor, center_cursor, pathology_focus_cursor, scar_focus_cursor, edema_focus_cursor, sampler_rng_state, batch_descriptor_cursor, next_batch_descriptor_sha256, extent_wall_ramp_value, code_hash, config_hash, split_hash, plans_hash, stock_checkpoint_hash]
  resume_assertions: [microbatch_cursor_zero, next_global_step_saved_plus_1, stage_and_scheduler_continuity, next_batch_descriptor_sha256_match, extent_wall_ramp_exact_match, no_optimizer_step_overlap_gap_or_duplicate]
