known_current_implementation_failures_that_must_be_repaired_before_training:
  - id: stage_budget_mismatch
    required: {stage_A: [0, 2000], stage_B: [2000, 10000], stage_C: [10000, 14000]}
    observed_old_run: {stage_A_steps: 2000, stage_B_steps: 4000, stage_C_steps: 8000}
  - id: scheduler_missing
    required: stage_local_linear_warmup_then_polynomial_decay_power_0_9
    observed_old_run: static_learning_rates_scheduler_state_none
  - id: partial_modality_training_missing
    required_stage_A_B_supercycle: {length: 20, complete: 10, lge_only: 5, lge_c0: 5}
    observed_old_run: complete_only_true_for_all_14000_steps
  - id: semantic_auxiliary_losses_missing
    required: [anatomy4, wall, signed_endo_epi_distance, scar_dense, scar_component, scar_center, scar_extent, scar_context, edema_dense, injury, edema_boundary, edema_extent, edema_context, relation, pathology_deep_supervision]
    observed_old_run: [multiclass, anatomy_ce, scar_binary, t2_gated_edema_binary]
  - id: sampler_contract_simplified
    required: [centerB_centerC_balance, pathology_focus_cycle, small_component, oof_fn, oof_fp, boundary, safe_negative]
    observed_old_run: deterministic_case_cycle_and_region_type_rotation
  - id: area_reference_hardcoded
    required: actual_train_only_median_pathology_to_wall_area_fraction
    observed_old_run: {scar: 0.20, edema: 0.30}
  - id: exact_resume_incomplete
    required: [model, optimizer, scheduler, precision_mode, global_step, stage_id, stage_step, microbatch_cursor, python_rng, numpy_rng, torch_cpu_rng, torch_cuda_rng_all, worker_seed, sampler_cursor, batch_descriptor_cursor, next_batch_sha, ramp, code_hash, config_hash, split_hash, plans_hash, stock_checkpoint_hash]
    observed_old_run: basic_subset_only
  - id: validator_false_pass
    required: parse_effective_contract_and_fail_on_every_known_deviation
    observed_old_run: presence_shape_and_smoke_only
  - id: metric_population_error
    required: pure_edema_T2_present_only
    observed_old_run: no_T2_empty_empty_Dice_1_rows_in_all_outer_mean
  - id: baseline_comparison_missing
    required: same_case_CARE_ASE_vs_nnunet_oof_vs_mosaic_clean_oof
    observed_old_run: CARE_ASE_only

model_contract:
  input_order: [LGE, T2, C0]
  labels: {background: 0, healthy_myocardium: 1, lv: 2, rv: 3, pure_edema: 4, scar: 5}
  stock_inheritance: complete_encoder_bottleneck_low_mid_decoder_and_anatomy_top_stages
  scar_top_path: exact_clone_of_stock_highest_two_decoder_stages
  edema_top_path: exact_clone_of_stock_highest_two_decoder_stages
  clone_includes: [transition, skip_fusion, convolution_blocks, deep_supervision_classifier]
  pathology_extra_evidence_entry: separate_zero_initialized_residual_projections
  normal_inference_reads_stock_class4_or_class5_logits: false
  step0_final_logit_parity_max_abs: 1.0e-6
  stock_parameter_byte_coverage_min: 0.99
  hard_roi_crop: forbidden
  hard_wall_transform: forbidden
  selector_or_ensemble: forbidden
  fixed_scar_priority: forbidden
  posthoc_threshold_search: forbidden

anatomy_and_context_contract:
  anatomy_target: remap_labels_4_and_5_to_1
  required_outputs: [anatomy_logits_0_3, p_wall_union, p_lv, p_rv, signed_endo_distance, signed_epi_distance, wall_depth_rho]
  wall_union_labels: [1, 4, 5]
  pathology_context_detached: true
  distance_target: physical_signed_edt_clipped_10mm_divided_10
  hard_anatomy_multiply_or_crop: forbidden

semantic_auxiliary_contract:
  scar:
    proposal_scales: [quarter, half]
    targets: [occupancy, component_center_heatmap, slice_presence, slice_area, four_class_context]
    context_priority: [scar, blood_pool_adjacent, normal_myocardium, remote_background, ignore]
    component_connectivity: 26
    center_sigma_inplane_mm: 4.0
    center_sigma_z_slices: 1.0
    keep_all_gt_components: true
  edema:
    targets: [pure_edema_dense, injury_4_or_5, signed_boundary, slice_presence, slice_area, four_class_context]
    context_priority: [pure_edema, blood_pool_adjacent, normal_myocardium, remote_background, ignore]
    scar_voxels_in_edema_context: ignore
    t2_present_only: true
    no_t2_negative_sampling: forbidden
  deep_supervision:
    scar_and_edema_highest_two_scales: required
    weights: exact_stock_nnunet_scale_weights_normalized_over_available_scales
  loss_weights_source: prompts/blueprints/CARE_ASE_exact_implementation_contract_v2_20260801.yaml
  every_loss_requires: [denominator_receipt, nonzero_gradient_on_valid_fixture, exact_zero_on_invalid_population, on_off_receipt]

sampler_contract:
  patch_descriptor_frozen_before_voxel_loading: true
  gradient_accumulation_microbatches: 4
  stage_A_B_supercycle: {length: 20, complete: 10, lge_only: 5, lge_c0: 5}
  complete_center_cycle: alternating_CenterB_CenterC_with_replacement
  complete_pathology_focus: alternating_scar_edema
  partial_pathology_focus: scar_only
  stage_C_supercycle: {length: 2, centerB_complete: 1, centerC_complete: 1}
  stage_C_pathology_focus: alternating_scar_edema
  scar_focus_percentages: {gt_component: 35, small_component: 20, oof_fn: 20, oof_fp: 15, random: 10}
  edema_focus_percentages: {positive: 35, oof_fn_or_low_volume: 20, boundary: 20, safe_fp: 15, random: 10}
  oof_source: canonical_patient_held_out_stock_prediction
  hard_negative_manifest_must_be_consumed_by_sampler: true
  current_model_online_error_refresh: forbidden

training_contract:
  optimizer: AdamW
  physical_batch: 1
  gradient_accumulation: 4
  gradient_clip_global_norm: 12.0
  precision: bf16_autocast_with_sensitive_reductions_fp32
  weight_decay: 1.0e-4
  total_optimizer_steps_per_fold: 14000
  stages:
    A:
      range: [0, 2000]
      warmup_steps: 200
      new_modules_lr: 5.0e-4
      cloned_top_blocks_lr: 1.0e-4
      cloned_pathology_classifiers_lr: 2.0e-4
    B:
      range: [2000, 10000]
      warmup_steps: 500
      new_modules_lr: 3.0e-4
      all_decoder_lr: 1.0e-4
      upper_two_encoder_stages_lr: 5.0e-5
      lower_encoder_frozen: true
    C:
      range: [10000, 14000]
      warmup_steps: 0
      population: actual_train_complete_only
      new_modules_lr: 1.0e-4
      all_decoder_and_upper_two_encoder_lr: 5.0e-5
      lower_encoder_and_bottleneck_lr: 1.0e-5
  scheduler: stage_local_linear_warmup_then_polynomial_decay_power_0_9
  optimizer_moments_preserved_across_stage_transitions: true
  fixed_checkpoint: step14000_only
  inner_monitor_only: true
  early_stop_or_stage_skip: forbidden

area_reference_contract:
  source_population: fold_specific_actual_train_only
  scar_reference: median_scar_to_gt_wall_area_fraction_on_scar_positive_slices
  edema_reference: median_pure_edema_to_gt_wall_area_fraction_on_T2_present_edema_positive_slices
  inner_or_outer_access: forbidden
  receipt_required: true

checkpoint_resume_contract:
  save_every_steps: 1000
  save_only_after_completed_optimizer_step_and_microbatch_cursor_zero: true
  atomic_protocol: tmp_write_fsync_file_fsync_parent_atomic_rename_sha256_full_reload
  complete_fields: [model, optimizer, scheduler, precision_mode, global_step, stage_id, stage_step, microbatch_cursor, python_rng, numpy_rng, torch_cpu_rng, torch_cuda_rng_all, dataloader_worker_seed, sampler_cursor, batch_descriptor_cursor, next_batch_descriptor_sha256, extent_wall_ramp_value, code_hash, config_hash, split_hash, plans_hash, stock_checkpoint_hash]
  resume_assertions: [next_global_step_saved_plus_1, stage_scheduler_continuity, next_batch_hash_match, ramp_match, no_overlap_gap_duplicate]

