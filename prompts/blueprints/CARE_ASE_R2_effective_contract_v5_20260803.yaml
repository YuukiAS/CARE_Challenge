    - RV5-D1_model_topology_named_projections_auxiliary_wiring
    - RV5-D2_augmentation_sampler_padding_extent_oof
    - RV5-D3_G1_candidate_mutation_source_audit
    - RV5-D4_fold1_G2_gpu_behavior
    - RV5-D5_fold4_G2_gpu_behavior
    - RV5-D6_commit_A_detached_implementation_review
    - RV5-D7_commit_B_packet_binding_review

