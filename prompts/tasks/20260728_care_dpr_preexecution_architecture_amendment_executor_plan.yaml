failure_policy:
  execution_failure: repair_in_place_same_wave
  proposal_limited: return_to_planner_for_proposal_redesign_not_abandonment
  refinement_limited: return_to_planner_for_reconstruction_redesign_not_abandonment
  arbitration_limited: return_to_planner_for_utility_action_redesign_not_abandonment
  architecture_ceiling_low: return_to_planner_for_global_redesign_not_abandonment
  allocation_expired: operational_block_exact_resume_no_new_job