schema_version: 1
canonical_roles:
  - planner
  - critic
  - controller
  - executor
  - mapper
  - finalizer
  - validator
  - reviewer
legacy_role_aliases:
  auditor: reviewer
  execution_controller: controller
  strategic_controller: planner
planning_states:
  - DRAFT_FOR_PLANNING_REVIEW
  - PLANNING_REVIEW_RUNNING
  - NEEDS_PLANNING_REVISION
  - READY_FOR_CODEX_MERGE
  - BLOCKED_HANDOFF_REVIEW
critic_required_when:
  task_kind:
    - scientific_milestone
  risk_level:
    - high
  architecture_impact:
    - system
  slurm_runtime_continuity_required: true
  executor_count_gt: 1
  route_change: true
  scientific_decision_scope_not:
    - none
controller_pre_review_fields:
  route_promotion_decision: NOT_REVIEWED
  route_negative_decision: NOT_REVIEWED
  scientific_resolution_status: AWAITING_REVIEW
git_defaults:
  auto_git_commit: true
  allow_git_commit: true
  auto_git_push: false
  allow_git_push: false
  allow_diagnostic_push: false
publication:
  allowed_lightweight_extensions:
    - .md
    - .csv
    - .json
  max_lightweight_file_bytes: 1048576
  forbidden_path_patterns:
    - "(^|/)checkpoints?(/|$)"
    - "checkpoint_.*\\.(pth|pt|ckpt)$"
    - "\\.(pth|pt|ckpt)$"
    - "(^|/)predictions?(/|$)"
    - "\\.nii(\\.gz)?$"
    - "\\.zip$"
    - "(^|/)upload_ready(/|$)"
    - "validation[_-]?package"
    - "hosted[_-]?validation"
    - "(^|/)logs?(/|$)"
    - "\\.log$"
    - "transcript"
    - "environment[_-]?dump"
    - "\\.env($|[./])"
    - "credential"
    - "secret"
