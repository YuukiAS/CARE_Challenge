schema_version: 1
base_required_files:
  - result.md
  - controller_context.json
  - controller_ledger.csv
  - controller_bootstrap_snapshot.md
  - implementation_snapshot.md
  - finalizer_state.json
  - validator_report.md
  - controller_report.md
  - completion_check.md
  - MANIFEST.md
conditional_required_files:
  review_required:
    - review_request.md
    - subagents/reviewer_prompt.md
  mapper_required:
    - mapper_report_draft.md
    - mapper_report_final.md
    - architecture_delta_final.md
  slurm_required:
    - finalizer_state.json
  accounting_continuation_triggered:
    - accounting_continuation_receipt.json
  replacement_attempt:
    - replacement_job_ledger.csv
    - operational_retry_receipt.json
    - preflight_receipt.json
  multi_executor:
    - executor_waves
  wiki_update_required:
    - mapper_report_final.md
    - architecture_delta_final.md
terminal_packet_states:
  - VERIFIED_COMPLETE
  - PACKET_COMMITTED_FOR_REVIEW
  - READY_FOR_LOCAL_PACKET_COMMIT
  - READY_FOR_MAPPER_FINAL
controller_completion_decisions:
  - VERIFIED_COMPLETE
  - NEEDS_REPAIR
  - OPERATIONALLY_BLOCKED
controller_completion_required_fields:
  - controller_verification_decision
  - operational_completion_status
  - experiment_adequacy_decision
  - contract_compliance_status
  - required_outputs_complete
  - validators_passed
  - all_jobs_terminal
  - aggregation_complete
  - git_commit_decision
  - git_push_decision
  - next_required_action
precommit_finalizer_fields:
  - task_key
  - final_state
  - git_commit_decision
  - precommit_head
  - tracked_paths
  - manifest_sha256
retry_finalizer_fields:
  - failure_class
  - retryable
  - suggested_next_state
  - attempt_number
  - supersedes_job_ids
  - replacement_job_ids
  - training_credit_policy
