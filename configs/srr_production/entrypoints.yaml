status_reason: >-
  Batch 3A replaced the Batch 2B label-copy MyoPS inference script with a
  model-in-loop SRRProposeRefineMyoPS diagnostic entrypoint. It reads real
  Dataset501 images and availability, loads schema-v2 checkpoints, restores
  frozen prototype/memory state, separates raw OOF anchor from no-T2 safety
  context, and requires evaluator contract/hash checks for SRR comparison.
  Because no trusted trained SRR checkpoint exists and this handoff does not
  authorize training, Slurm, validation packaging, upload, or hosted claims,
  formal training remains unauthorized pending a separate user-approved budget.
  Batch 3B added a real Dataset502 4D Cine diagnostic mainline for time-axis
  audit, frame0 label-geometry reference selection, image-based non-reference
  registration/warp, temporal aggregation that changes ED-space output, and local
  evaluator/export correctness evidence. Cine remains diagnostic only.

