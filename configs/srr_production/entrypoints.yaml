      - Writes casewise, subgroup, help/harm, component, and remote-FP receipts from prediction/GT NIfTI.
      - SRR comparison requires explicit --srr-pred-dir plus --srr-contract and verifies prediction hashes.
      - Does not authorize SRR performance, hosted metrics, or validation upload.

  - id: myops_batch2a_mainline_validator
    role: nontraining_component_smoke_validator
