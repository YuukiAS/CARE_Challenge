status_reason: >-
  Batch 2A repaired several shared MyoPS components, and Batch 2B established
  a real nnU-Net fold0 metric recomputation plus byte-identical label-copy
  identity audit. However scripts/srr_production/infer_myops.py does not yet
  read Dataset501 images, instantiate SRRProposeRefineMyoPS, load a checkpoint,
  load frozen prototype/memory assets, or execute model inference. Its three
  modes currently copy raw nnU-Net prediction NIfTI files. Formal training is
  blocked because a trained checkpoint could not yet enter a trusted full-volume
  SRR inference and evaluation path.

selected_model:
  class_name: SRRProposeRefineMyoPS
  path: src/care_myocardium/models/srr_propref.py
  status: real_model_components_but_no_trusted_full_volume_inference
  notes:
    - Existing modality encoders, retrieval, anatomy, proposal dictionaries, soft-ROI refiners, and bounded corrections are retained.
    - Batch 2A connected casewise prototype/memory smoke and masked zero-count slots.
    - Training and validation/inference still require distinct memory query policies.
    - Raw OOF anchor and derived no-T2 safety context must be separated at the model interface.

