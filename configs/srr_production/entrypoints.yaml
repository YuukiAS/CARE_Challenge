  - id: cine_batch3b_real_4d_mainline_candidate
    role: batch3b_real_cine_4d_registration_temporal_export_audit
    path: scripts/srr_production/infer_cine_batch3b.py
    formal_authority: false
    audit_status: real_4d_cine_mainline_diagnostic_complete_not_training
    notes:
      - Reads real Dataset502 Cine NIfTI as t,z,y,x and fails closed on missing time axis.
      - Selects frame0 as the label-geometry reference/ED-space frame and records the policy per case.
      - Uses slice-wise image-based optical-flow registration from non-reference frame 15 into reference space, warps anatomy proxy labels, and requires non-reference evidence to alter the final ED-space output.
      - Exports geometry-preserving raw-label NIfTI predictions and writes local Dice/HD95 diagnostics without hosted or performance claims.
      - Does not use CineMA because this batch did not load official CineMA weights.

  - id: myops_batch2_fair_evaluator
    role: local_nifti_metric_recompute_authority
