schema_version: 1
authority_name: srr_production_batch0_formal_entrypoints
created_from_head: 3f36a4ec62278ae097267d9c0eea14dd5e68a9e7
formal_training_status: BLOCKED_PENDING_BATCH2B_INFERENCE_AND_FAIR_EVALUATION
status_reason: >-
  Batch 2A closed the Batch 1 production-component gap without training:
  validator and training runner now share raw OOF anchor manifest semantics,
  casewise four-shard prototype/memory helpers, count-masked cross-fitted
  memory query, explicit no-T2 exact-zero safety outputs, and checkpoint
  schema-v2 resume helpers. Formal training remains blocked until Batch 2B
  full-volume inference and fair evaluation authority is established.

selected_model:
  class_name: SRRProposeRefineMyoPS
  path: src/care_myocardium/models/srr_propref.py
  status: real_batch2a_shared_component_closure_no_training
  notes:
    - Uses existing encoder, retrieval, proposal dictionary, crop soft-ROI refiner, and final-output variants.
    - Production Batch 2A requires strict casewise train/OOF prototypes and masks zero-count memory slots from similarity.
    - M10 cross-fitted memory is connected to proposal logits, and production crossfit-exclusive queries bypass global self-leaking prototype buffers.

formal_entrypoints: []

candidate_entrypoints:
  - id: srr_propref_myops_fold0_candidate
    role: training_and_local_evaluation_candidate
    path: scripts/training/run_srr_propref_myops_fold0.py
    formal_authority: false
    audit_status: real_but_incomplete
    allowed_in_batch0: read_only_audit_static_tests_only
    blocked_reasons:
      - no production authority wrapper yet
      - formal training is still unauthorized
      - Batch 2B full-volume inference/fair evaluation authority not yet complete
      - current evaluation is local prediction/GT recomputation, not hosted or performance-authoritative
  - id: myops_batch1_mainline_validator
    role: non_training_production_authority_validator
    path: scripts/srr_production/validate_myops_mainline.py
    config_path: configs/srr_production/myops_batch1.yaml
    formal_authority: false
    audit_status: batch1_non_training_complete_for_batch2
    allowed_in_batch1: strict_manifest_forward_backward_intervention_checkpoint_tests_only
    notes:
      - Generated a complete 220-case real OOF nnU-Net anchor manifest.
      - Batch 2A upgraded the manifest semantics to raw, unmodified OOF anchor plus derived safety context.
      - Proved production final output uses anchor_bounded_srr_correction in smoke, not pure SRR.
      - Batch 2A generated shared component receipts under results/srr_production/code_maturity/batch2a_*.
      - Does not authorize formal training or performance claims.
  - id: unified_prediction_evaluator
    role: local_prediction_metric_recompute_candidate
    path: scripts/evaluation/evaluate_predictions.py
    formal_authority: false
    audit_status: already_real_and_reusable_for_local_metrics
    notes:
      - Recomputes Dice and optional HD/HD95 from prediction NIfTI and GT NIfTI.
      - It is not a training entrypoint and does not make hosted leaderboard claims.

required_real_assets:
  myops_raw:
    path: data/nnUNet/nnUNet_raw/Dataset501_CAREMyoPS
    role: real Dataset501 imagesTr and labelsTr source
  myops_protocol_split:
    path: data/benchmarks/protocol/splits_MyoPS.json
    role: patient/case split source for fold evaluation
  nnunet_anchor_root:
    path: data/nnUNet/nnUNet_results/Dataset501_CAREMyoPS/nnUNetTrainer_500epochs__nnUNetPlans__3d_fullres
    role: fold validation probabilities and predictions used as cached nnU-Net anchor/context
  nnunet_checkpoint_pattern:
    path: data/nnUNet/nnUNet_results/Dataset501_CAREMyoPS/nnUNetTrainer_500epochs__nnUNetPlans__3d_fullres/fold_*/checkpoint_best.pth
    role: real nnU-Net checkpoints, not directly loaded by current SRR runner

