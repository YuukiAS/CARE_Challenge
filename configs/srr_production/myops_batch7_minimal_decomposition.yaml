controller_bind_latest_main: true
comprehensive_audit_path: results/srr_production/code_maturity/batch7_br2_sip_comprehensive_architecture_audit_20260722.md

source_checkpoint:
  path: results/20260721_srr_batch7_upstream_candidate_quality/runtime/attempts/batch7_formal300_htzhulab_59789651/variants/batch7_formal300_htzhulab_59789651/checkpoints/fold_0/propref_config/checkpoint_validation_step_300.pt
  sha256: d34ad65890cbb6a12aac3fc35bcab71709d680bff5a3aae2d93e010db1cc0e0d
  global_step: 300

paths:
  split_path: data/benchmarks/protocol/splits_MyoPS.json
  anchor_root: data/nnUNet/nnUNet_results/Dataset501_CAREMyoPS/nnUNetTrainer_500epochs__nnUNetPlans__3d_fullres
  result_root: results/20260722_srr_batch7_minimal_pathology_decomposition
  runtime_root: results/20260722_srr_batch7_minimal_pathology_decomposition/runtime
  log_root: logs/srr_batch7_minimal_decomposition
  lock_root: results/20260722_srr_batch7_minimal_pathology_decomposition/runtime/locks

model:
  class_name: SRRProposeRefineMyoPS
  source_variant: m10_d3_hierarchical_memory_propref
  encoder_profile: full_4scale
  base_channels: 32
  final_output_mode: anchor_bounded_srr_correction
  maximum_correction_logit_delta: 4.0
  backbone_replacement: forbidden
  encoder_redesign: forbidden
  current_m10_spatial_dictionary_formal_use: false
  prototype_maps_formal_use: false
  semantic_negative_memory_formal_use: false

training_data:
  fold: 0
  train_case_count: 176
  validation_case_count: 44
  full_dataset_inventory:
    lge_t2_c0: 80
    lge_c0: 24
    lge_only: 116
    lge_t2_without_c0: 0
  expected_center_observation_patterns:
    CenterA: lge_only
    CenterH: lge_only
    CenterB: lge_t2_c0
    CenterC: lge_t2_c0
    CenterE: lge_c0
    CenterF: lge_c0
    CenterG: lge_c0
  source_definition:
    paper_source_semantics: acquisition_center
    training_source_id: metadata_center
    observation_set: availability_vector
    deployment_source_id: availability_pattern_pooled
    availability_patterns:
      lge_only: [1, 0, 0]
      lge_c0: [1, 0, 1]
      lge_t2_c0: [1, 1, 1]
    center_as_network_input: forbidden
    center_as_router_feature: forbidden
    center_as_training_coefficient_index: allowed
    validation_inference_uses_center_specific_coefficient: false
    derive_and_verify_fold0_center_counts: true
  pathology_supervision:
    scar:
      eligible_source_rule: reliable_scar_label
      source_balanced_sampling: true
    edema:
      eligible_source_rule: t2_present_and_reliable_edema_label
      no_t2_source_coefficient: forbidden
      no_t2_source_sip_membership: forbidden
      no_t2_edema_supervision: forbidden
      source_balanced_sampling: true

output_semantics:
  decode_rule: outputs_logits_argmax
  primary_population: positive_gt_cases
  same_split_anchor_required: true
  primary_deployment_subgroup: complete_trimodal
  report_all_case_empty_safe_separately: true
  validation_must_use_deployment_pattern_coefficient: true

common_training:
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 12.0
  optimizer_steps: 400
  full_volume_eval_steps: [200, 400]
  batch_size: 1
  patch_shape: [12, 96, 96]
  encoder_frozen: true
  base_retrieval_frozen: true
  refiner_frozen: true
  source_arbiter_frozen: true
  production_gate_frozen: true
  production_gate_mode: fixed_one_for_matched_anchor_relative_evaluation
  source_balanced_sampler:
    enabled: true
    selection_order: uniform_eligible_center_then_uniform_case_then_pathology_or_anchor_error_patch
    require_exact_sampling_manifest: true
    max_source_count_deviation_fraction: 0.15
  br2_optimization_schedule:
    steps_1_50: train_pattern_and_center_coefficients_plus_target_pathology_heads_representers_frozen
    steps_51_350: alternate_coefficient_block_and_representer_pathology_block
    steps_351_400: freeze_representers_calibrate_coefficients_and_target_pathology_heads
    no_sip_and_sip_schedule_identical: true

lightweight_br2:
  enabled_variants: [scar_br2_no_sip, scar_br2_sip, edema_br2_no_sip, edema_br2_sip]
  feature_stage: full_resolution_pathology_feature_before_proposal
  representers:
    - id: shared_anatomy
      required_modalities: [LGE]
      kind: shared
    - id: lge_private
      required_modalities: [LGE]
      kind: private
    - id: c0_private
      required_modalities: [C0]
      kind: private
    - id: t2_private
      required_modalities: [T2]
      kind: private
    - id: interaction_lge_c0
      required_modalities: [LGE, C0]
      kind: interaction
    - id: interaction_lge_t2
      required_modalities: [LGE, T2]
      kind: interaction
    - id: interaction_t2_c0
      required_modalities: [T2, C0]
      kind: interaction
  representer_architecture:
    one_module_per_representer: true
    private_adapter: groupnorm_depthwise3x3_pointwise1x1_residual
    shared_input: availability_masked_mean_of_normalized_observed_modality_features
    interaction_input: concat_normalized_pair_product_and_absolute_difference
    final_projection_zero_initialized: true
    pathology_output_projection_zero_initialized: true
    output_normalization: per_case_per_representer_rms
    output_rms_target: 1.0
    output_rms_epsilon: 0.000001
    duplicate_tensor_alias_forbidden: true
  coefficients:
    pathology_specific: true
    spatially_global: true
    signed_unconstrained: true
    softmax_or_simplex_normalization: forbidden
    topk_normalization: forbidden
    image_conditioned_coefficient_residual: forbidden
    hard_availability_mask_by_multiplication: true
    invalid_coefficient_exact_zero: true
    hierarchical_form: beta_center_equals_beta_pattern_plus_center_deviation
    center_deviation_zero_sum_within_pattern: true
    training_forward_uses_center_beta: true
    validation_and_deployment_forward_uses_pattern_beta_only: true
    output_beta_pattern_separately: true
    output_beta_center_separately_for_training_diagnostics: true
    output_center_deviation_separately: true
    output_effective_masked_beta_separately: true
  prohibited_legacy_assets:
    prototype_bank: true
    prototype_maps: true
    semantic_negative_memory: true
    m10_16slot_spatial_dictionary: true

sip:
  decision: MODIFY_AND_RETAIN_AS_EXPLICIT_ABLATION
  legacy_semantic_retrieval_regularization_formal_weight: 0.0
  legacy_pattern_sip_integrativeness_formal_weight: 0.0
  legacy_classification: legacy_heuristic_not_paper_sip
  new_loss_name: loss_br2_selective_integration_penalty
  sparsity_loss_name: loss_br2_source_l1_sparsity
  center_deviation_loss_name: loss_br2_center_deviation_shrinkage
  coefficient_domain: signed_center_specific_beta_after_representer_rms_normalization
  eligible_source_rule:
    scar: centers_with_required_modalities_and_reliable_scar_supervision
    edema: centers_with_required_modalities_and_t2_present_reliable_edema_supervision
  exclude_no_pathology_supervision_sources: true
  exclude_representers_with_eligible_source_count_at_most: 1
  tau: 0.10
  tau_requires_fixed_representer_rms: true
  formula_unit_tests_required:
    - gamma_at_most_one_equal_penalty
    - fully_shared_penalty_zero
    - eligible_source_count_one_excluded
    - unavailable_modality_source_not_counted
    - unsupervised_edema_source_not_counted
    - smooth_truncated_l1_matches_formula
    - signed_coefficient_absolute_value_used
  lambda_sparse: 0.01
  lambda_center_deviation: 0.01
  lambda_sip_candidates: [0.005, 0.01, 0.02]
  lambda_selection:
    calibration_data: fixed_train_only_center_balanced_cohort
    target_gradient_ratio: 0.10
    preferred_ratio_range: [0.03, 0.20]
    absolute_allowed_ratio_range: [0.01, 0.30]
    deterministic_rule: select_candidate_closest_to_target_with_preferred_range_then_absolute_range
    subjective_selection_forbidden: true
  theoretical_claim_boundary:
    original_excess_risk_bound_applies_to_this_dense_model: false
    allowed_claim: R2_BR2_SIP_inspired_medical_imaging_adaptation

