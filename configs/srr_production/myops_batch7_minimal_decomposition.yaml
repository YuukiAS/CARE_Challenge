    br2_enabled: true
    sip_enabled: true
    trainable_groups: [scar_evidence_head, scar_discovery_head, scar_confirmation_head, scar_proposal_reliability, scar_lightweight_br2, scar_br2_coefficients]
  edema_minimal:
