minimal_retain_gate:
  minimum_positive_dice_delta: 0.003
  require_help_not_less_than_harm: true
  maximum_hd95_relative_worsening: 0.05
  maximum_remote_fp_relative_worsening: 0.05
  require_complete_trimodal_dice_delta_nonnegative: true
  require_no_t2_edema_exact_zero: true

br2_increment_gate:
  minimum_additional_positive_dice_over_minimal: 0.001
  require_help_harm_not_worse: true
  maximum_hd95_relative_worsening_vs_minimal: 0.02
  maximum_remote_fp_relative_worsening_vs_minimal: 0.02
  require_complete_trimodal_not_worse: true
  maximum_worst_positive_center_dice_drop: 0.003

sip_increment_gate:
  minimum_additional_positive_dice_over_no_sip: 0.0005
  maximum_allowed_dice_drop_for_safety_win: 0.0005
  minimum_hd95_or_remote_fp_improvement_for_safety_win: 0.02
  require_help_harm_not_worse: true
  require_complete_trimodal_not_worse: true
  maximum_worst_positive_center_dice_drop: 0.003

terminal_decisions:
  required: [scar_minimal, scar_br2, scar_sip, edema_minimal, edema_br2, edema_sip]
  values:
    minimal: [RETAIN, RETIRE]
    br2: [RETAIN, RETIRE, NOT_APPLICABLE]
    sip: [RETAIN, REMOVE, NOT_APPLICABLE]

