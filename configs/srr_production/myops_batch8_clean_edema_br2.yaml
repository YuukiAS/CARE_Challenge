batch7_evidence_repair:
  required: true
  historical_result_root: results/20260722_srr_batch7_minimal_pathology_decomposition
  required_checkpoint_stages: [warmup50, step200, step400]
  required_variants:
    - scar_br2_no_sip
    - scar_br2_sip
    - edema_br2_no_sip
    - edema_br2_sip
  checkpoint_derived_fields:
    - beta_pattern
    - center_deviation
    - effective_beta
    - representer_pre_beta_rms
    - pathology_projection_weight_norm
    - pathology_projection_bias_norm
    - proposal_logit_q01
    - proposal_logit_q50
    - proposal_logit_q99
    - predicted_positive_voxels
    - sip_value
    - sip_gradient_norm
  reject_tokens: [PENDING, STATIC_INITIAL_COEFFICIENTS, PLACEHOLDER, EVIDENCE_NOT_FOUND]
  scar_retraining: forbidden

model:
  file: src/care_myocardium/models/srr_batch8_clean_edema.py
  class_name: CleanEdemaBR2Corrector
  pathology: edema
  frozen_backbone:
    modality_encoders: true
    base_retrieval: true
    anatomy_decoder: true
    edema_decoder: true
    anatomy_union_context: true
  clean_head:
    inputs: [frozen_edema_feature, resampled_t2_image, frozen_anatomy_union_probability]
    block1: conv3d_3x3_groupnorm_silu
    block2: conv3d_3x3_groupnorm_silu
    output: conv3d_1x1_delta
    output_layer_zero_initialized: true
  final_output:
    anchor_base: raw_same_split_nnunet_logits
    modified_channel: 4
    correction_formula: anchor_edema_logit_plus_2_tanh_delta
    all_other_channels_unchanged: true
    decode: six_class_argmax
    no_t2_delta_exact_zero: true
    no_t2_final_anchor_identity: true
  clean_br2:
    enabled_variant: edema_clean_br2
    feature_stage: frozen_full_resolution_edema_feature_before_clean_head
    representers:
      - id: shared_anatomy
        required_modalities: [LGE]
      - id: lge_private
        required_modalities: [LGE]
      - id: t2_private
        required_modalities: [T2]
      - id: interaction_lge_t2
        required_modalities: [LGE, T2]
    independent_modules: true
    final_adapter_zero_initialized: true
    output_normalization: per_case_per_representer_rms
    output_rms_target: 1.0
    coefficients:
      pathology_specific: true
      signed: true
      spatially_global: true
      softmax_simplex_topk: forbidden
      image_conditioned_residual: forbidden
      training_sources: [CenterB, CenterC]
      beta_center_equals_pooled_plus_center_deviation: true
      center_deviation_zero_sum: true
      validation_uses_pooled_beta_only: true
      center_as_network_input: forbidden
  forbidden_runtime_symbols:
    - ProposalDictionary
    - M10TwoPassSpatialDictionary
    - M10CrossFittedPrototypeMemory
    - CropSoftROIRefinementHead
    - DifferentiableSoftROIRefinementHead
    - PathologySourceArbiter
    - BranchArbitrationGate
    - BaselinePreservingResidualGate
    - production_correction_gate

training_data:
  fold: 0
  train_case_count: 176
  validation_case_count: 44
  training_pathology: edema
  eligible_centers: [CenterB, CenterC]
  require_t2_present: true
  require_reliable_edema_supervision: true
  no_t2_training: forbidden
  no_t2_negative_mining: forbidden
  source_balanced_sampler:
    order: uniform_center_then_uniform_case_then_patch_type
    patch_types:
      edema_positive: 0.50
      nnunet_edema_error: 0.50
    exact_manifest_required: true

