schema_version: 2
task_key: 20260723_care_myops_batch9_exposed_issues_repair
status: READY_FOR_CONTROLLER
base_task: 20260722_care_myops_batch9_reliable_label_distillation
result_root: results/20260723_care_myops_batch9_exposed_issues_repair

model:
  class_name: CAREMMReliableDistillResEnc
  deployed_forward_contract_unchanged: true
  nnunet_anchor_or_logits: forbidden
  nnunet_checkpoint_or_prediction: forbidden
  baseline_fallback: forbidden
  old_srr_or_br2_components: forbidden
  external_data_or_weights: forbidden

formal_trainer:
  file: src/care_myocardium/training/nnUNetTrainerCAREMMReliableDistill.py
  class_name: nnUNetTrainerCAREMMReliableDistill
  inherit_nnunet_v2_training_infrastructure: true
  formal_optimizer_loop_owner: nnUNetTrainerCAREMMReliableDistill
  old_runner_formal_optimizer_loop: forbidden
  old_runner_allowed_roles: [orchestration, preflight, evidence_collection]
  standard_nnunet_model_weights_or_outputs: forbidden

plans:
  plans_identifier: nnUNetResEncUNetMPlans
  resolve_with: [PlansManager, ConfigurationManager]
  configuration: 3d_fullres
  patch_size: from_resolved_plans
  kernel_sizes: from_resolved_plans
  strides: from_resolved_plans
  features_per_stage: from_resolved_plans
  deep_supervision_scales: from_resolved_plans
  hardcoded_architecture_or_patch_fallback: forbidden
  fail_if_official_resenc_m_plans_unavailable: true

augmentation:
  source: nnunet_v2_training_transforms
  required_families:
    - spatial_rotation_and_scaling
    - mirroring
    - gaussian_noise
    - gaussian_blur
    - brightness_and_contrast
    - gamma
    - low_resolution_simulation
  transform_config_hash_required: true
  per_step_augmentation_seed_required: true
  matched_control_distill_same_parameters: true

deep_supervision:
  enabled: true
  use_resolved_decoder_scales: true
  reliable_masks_applied_at_every_scale: true
  target_downsampling: nearest_neighbor
  weight_normalization: sum_to_one
  inference_uses_highest_resolution_only: true
  deployed_output_contract_unchanged: true

repairs:
  loss_normalization:
    expand_case_mask_to_loss_tensor: true
    denominator: valid_voxel_count
    record_raw_terms: true
    record_weighted_contributions: true
    record_per_term_gradient_norms: true
    fail_on_nonfinite_or_patch_volume_dependence: true
  anatomy_loss:
    cross_entropy_includes_background: true
    dice_excludes_background: true
  loss_conflict_audit:
    real_batches: 32
    cosine_conflict_threshold: -0.25
    conflict_batch_fraction_threshold: 0.25
    weighted_gradient_norm_ratio_max: 10.0
    if_final_six_conflicts_with_scar_or_edema: set_loss_final_six_class_reliable_weight_zero
    otherwise: retain_declared_weight
    fail_if_other_conflict_or_domination_persists: true
  optimizer:
    direct:
      type: SGD
      initial_lr: 0.01
      momentum: 0.99
      nesterov: true
      weight_decay: 0.00003
      schedule: polynomial
      poly_power: 0.9
      final_lr: 0.0
    continuation:
      type: SGD
      initial_lr: 0.001
      momentum: 0.99
      nesterov: true
      weight_decay: 0.00003
      schedule: polynomial
      poly_power: 0.9
      final_lr: 0.0
  sampler:
    target_probabilities:
      scar: 0.35
      edema_reliable: 0.35
      anatomy: 0.20
      background: 0.10
    fixed_class_priority: forbidden
    probability_absolute_tolerance: 0.02
    manifest_required: true
  no_t2_decode:
    training_supervision: zero
    distillation_supervision: zero
    inference_class4_hard_mask_before_argmax: true
    required_predicted_edema_voxels: 0
  validation:
    interval_epochs: 25
    eval_cases: 44
    save_every_validation: true
    checkpoint_selection:
      primary: maximize_min_complete_trimodal_scar_edema_dice
      secondary: maximize_mean_complete_trimodal_scar_edema_dice
      tertiary: minimize_sum_positive_gt_hd95
      reject_gt_positive_empty: true
      reject_no_t2_edema_nonzero: true
      reload_selected_checkpoint: true
  fixed_overfit:
    patterns: [natural_complete_trimodal, natural_lge_c0, natural_lge_only]
    fresh_model_per_pattern: true
    fresh_optimizer_per_pattern: true
    fresh_scheduler_per_pattern: true
    formal_direct_loss_optimizer_scheduler_required: true
    cross_pattern_state_reuse: forbidden
  full_step_matched_manifest:
    runtime_row_every_optimizer_step: true
    tracked_streaming_hash_required: true
    fields:
      - step
      - case_id
      - patch_bounds
      - augmentation_seed
      - augmentation_parameters_hash
      - student_availability_mask
      - learning_rate
      - teacher_checkpoint_sha256
      - teacher_input_hash
    mismatch_count_required: 0
  distillation_coverage:
    eligible_batches_minimum: 32
    feature_nonzero_batch_fraction_min: 0.95
    logits_nonzero_batch_fraction_min: 0.50
    anatomy_nonzero_batch_fraction_min: 0.50
    scar_gt_confident_voxel_fraction_min: 0.05
    edema_gt_confident_voxel_fraction_min: 0.05
    natural_incomplete_distillation_count_required: 0
    fail_before_control_distill_if_not_met: true
  validators:
    real_error_injection_required: true
    self_reported_injected_rejected_rows_forbidden: true
    per_seed_decision_required: true
    cross_seed_average_cannot_override_seed_failure: true
    finalizer_fields_derived_from_runtime: true

training:
  seeds: [20260723, 20260724]
  direct:
    epochs: 500
    steps_per_epoch: 250
    total_optimizer_steps: 125000
    patch_size: from_resolved_plans
    batch_size: 1
  continuation_gate:
    both_seeds_required: true
    zero_gt_positive_empty_predictions: true
    no_t2_edema_voxels_exact_zero: true
    each_pathology_improves_over_original_batch9_same_seed: true
  teacher:
    epochs: 100
    steps_per_epoch: 250
    total_optimizer_steps: 25000
    warm_start: repaired_direct_selected_checkpoint_same_seed
  moddrop_control:
    epochs: 100
    steps_per_epoch: 250
    total_optimizer_steps: 25000
    warm_start: repaired_direct_selected_checkpoint_same_seed
  reliable_distill:
    epochs: 100
    steps_per_epoch: 250
    total_optimizer_steps: 25000
    warm_start: repaired_direct_selected_checkpoint_same_seed
    per_seed_noninferiority_required: true

slurm:
  python: /users/a/e/aereinh/CARE/envs/env_CARE/bin/python
  seed20260723_partition: htzhulab
  seed20260724_partition: a100-gpu
  training_dependencies: afterok
  finalizer_dependency: afterany
  routing_race_allowed_by_skill: true
  semantic_or_budget_change_for_race: forbidden

forbidden_actions:
  - Batch10
  - nnunet_anchor_or_prediction_fallback
  - standard_nnunet_checkpoint_or_logits
  - old_SRR_forward_or_loss
  - BR2_lite
  - SIP
  - prototype_or_memory
  - proposal_or_refiner
  - Cine
  - fold_expansion
  - external_data_or_pretrained_weights
  - validation_upload
  - hosted_metric_claim
  - route_promotion
