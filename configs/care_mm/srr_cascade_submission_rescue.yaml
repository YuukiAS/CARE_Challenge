  edema_support_distance_mm: 15.0
  no_t2_edema_exact_anchor_identity: true
  correction_projection_zero_init: true
  scar_head:
    blocks: 2
    conv_kernel: [3, 3, 3]
    normalization: GroupNorm
    activation: SiLU
    inputs:
      - teacher_full_resolution_feature
      - normalized_LGE
      - anchor_probabilities_6
      - teacher_anatomy_probabilities
      - scar_source_margin
      - anchor_uncertainty
      - soft_union_probability
      - distance_to_union
      - scar_positive_similarity
      - scar_safe_negative_similarity
  edema_head:
    blocks: 2
    conv_kernel: [3, 3, 3]
    normalization: GroupNorm
    activation: SiLU
    outputs: [zone_aux_logit, pure_edema_delta]
    inputs:
      - teacher_full_resolution_feature
      - normalized_T2
      - normalized_LGE
      - anchor_probabilities_6
      - teacher_edema_probability
      - teacher_anatomy_probabilities
      - anchor_uncertainty
      - soft_union_probability
      - distance_to_union
      - edema_zone_positive_similarity
      - edema_safe_negative_similarity
