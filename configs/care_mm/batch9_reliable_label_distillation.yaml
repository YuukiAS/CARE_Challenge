  maximum_startup_retries: 2
  maximum_preemption_retries: 2
  isolated_runtime_log_lock_prediction_roots: true

baseline:
  trainer: nnUNetTrainer_500epochs
  plans: nnUNetPlans
  configuration: 3d_fullres
  fold0_class_dice:
    edema: 0.3944
    scar: 0.5602
  use_as_network_anchor: false
  use_as_evaluation_baseline: true

formal_evaluation:
  case_count: 44
  selected_checkpoint_must_reload: true
  decode_rule: six_class_logits_argmax
  metrics:
    - dice
    - hd95
    - precision
    - recall
    - component_count
    - remote_false_positive_volume
    - prediction_volume_ratio
    - empty_prediction_rate
    - changed_voxels_vs_standard_nnunet
  subgroups:
    - all_cases
    - positive_gt
    - complete_trimodal
    - CenterB
    - CenterC
    - lge_only
    - lge_c0
    - small_scar
    - large_scar
    - low_baseline
    - high_baseline
  required_outputs:
    - training_adequacy.csv
    - checkpoint_selection.csv
    - prediction_manifest.csv
    - casewise_metrics.csv
    - subgroup_metrics.csv
    - help_harm.csv
    - supervision_audit.csv
    - final_logit_authority_checks.csv
    - distillation_mechanism.csv
    - matched_run_manifest.csv

retain_gates:
  direct_reliable:
    complete_trimodal_scar_non_worse_than_standard_nnunet: true
    complete_trimodal_edema_non_worse_than_standard_nnunet: true
    at_least_one_pathology_absolute_gain_min: 0.005
  moddrop_control:
    maximum_mean_drop_per_pathology_vs_direct: 0.002
    empty_prediction_rate_must_not_increase: true
  reliable_distill_vs_moddrop:
    each_seed_scar_delta_min: 0.0
    each_seed_edema_delta_min: 0.0
    mean_scar_delta_min: 0.003
    mean_edema_delta_min: 0.005
    alternative_mean_pathology_delta_min: 0.005
    alternative_weaker_pathology_nonnegative: true
    combined_help_not_less_than_harm: true
    maximum_hd95_relative_worsening: 0.02
    empty_prediction_rate_must_not_increase: true
  allowed_terminal_tokens:
    - BATCH9_RELIABLE_DISTILL_RETAIN_PENDING_PLANNER
    - BATCH9_DIRECT_RESENC_ONLY_PENDING_PLANNER
    - BATCH9_MAINLINE_NO_USABLE_SIGNAL_RETURN_TO_PLANNER

publication_boundary:
  allowed_story: reliable_label_distillation_for_partially_observed_multisequence_cardiac_mr_segmentation
  unseen_center_d_generalization_proven_locally: false
  center_missingness_causally_separated: false
